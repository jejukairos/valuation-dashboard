# PBR 계산기 탭에 나올 종목.
# 종목을 추가하려면 한 덩어리를 복사해서 이름·코드·배수만 고치면 돼요.
#
#  - name: 종목 이름
#    code: "005930"              # 6자리 종목코드
#    multiples: [0.9, 1.0, 1.1]  # 계산해 볼 PBR 배수 (비워두면 10년 밴드의 하단·평균·상단을 자동으로 사용)
#    memo: ""                    # 화면에 같이 보여줄 내 메모

base_year: 27E   # 기준 연도 (화면에서 강조하고, "몇 % 내리면 PBR 몇 배" 문장을 만드는 연도)

stocks:
  - name: 삼성전자
    code: "005930"
    multiples: [0.7, 0.9, 1.0, 1.2, 1.4, 1.8]
    # [배수, 이름, 누구 기준] — 사용자 11/5: "0.7배 정도가 저평가, 1배면 매력적" + 증권사 시각 "바닥 1.2배"
    marks: [[0.7, 저평가, "내 기준"], [1.0, 매력적, "내 기준"], [1.2, 20년 바닥, "증권사 시각 · 12MF"], [1.4, 이번 사이클 바닥, "증권사 시각 · 12MF"]]
    alert: {year: 28E, below: 1.0, text: "28E PBR 1배 이하는 기회라는 말이 있음"}
    # 📊 증권사 시나리오별 밸류에이션 (사용자 11/14 "Bear·Base 나눈 거 좋다, 신호 탭이나 각 종목에") — 신호 탭 표 아래 + 종목 상세 맨 위 · '지금 주가' PBR·PER 은 화면이 매일 다시 계산
    #   표 숫자 그대로 · pbr·per = 유진이 표를 만든 날 주가 기준 (2025 = 25년 말 주가)
    scen:
      src: "유진투자증권 '삼성전자, SK하이닉스 시나리오별 밸류에이션' 표 (사용자 전달 11/14)"
      years: ["2025", 26E, 27E, 28E]
      base: {bps: [62995, 108859, 174333, 253212], eps: [7477, 51925, 88945, 108078], pbr: [1.90, 1.83, 1.14, 0.79], per: [16.00, 3.83, 2.24, 1.84]}
      bear: {bps: [62995, 110602, 167515, 191014], eps: [7477, 53907, 79209, 45097], pbr: [1.90, 1.80, 1.19, 1.04], per: [16.00, 3.69, 2.51, 4.41]}
    # 📌 신호 탭 표·종목 상세 밴드 차트 위에 같이 보이는 코멘트 (사용자 11/7: "신호쪽과 차트 있는쪽에 코멘트")
    # 첫 줄 = 닫힌 칸 제목, 나머지 = 눌러야 보임 (사용자 11/7: 조잡하니 간추리고 전달받은 건 닫아 둘 것)
    chart_note:
      - "📌 전달받은 시각 (11/7) — 27E PBR 1배 ≈ 17.1만원 · 1.04배 ≈ 17.8만원 (-8%) · 0.83배 ≈ 14.2만원 (-27%)"
      - "그 글: 1.04배(약 18만원) 근처부터 바닥권, 과거 하락 사이클 최저 0.83배까지는 더 빠질 여지 (추천 아님)"
      - "글의 '0.83배 약 13만원'은 계산하면 0.76배쯤이라 숫자가 안 맞아요 (11/6 종가 19.35만원 · 27E PBR 1.13배로 계산)"
      - "⚠ 27E(내년 말) BPS 기준이라 📏 기준선(12MF)과 잣대가 달라요"
    memo:
      - "레거시 반도체 시절 PBR: 업황 최악일 때 0.9배, 보통 1~1.8배, 평균 약 1.5배. 27년은 거의 확정된 실적으로 봄."
      - "🗣 투자자 글(11/5): 고점 33.4만원 때 PBR 약 4배 → 20.9만원에서 2.0배, 1년 뒤 이익 300조원을 가정해도 1.5배. 과거 평균 1배 전후보다 높아서 '저평가 아님'. 본인은 0.7배 근처에서 샀다고 함."
      - "🗣 같은 글: 확률이 반반인 곳엔 베팅하지 않고, 모두가 '안 된다'고 볼 때 사는 게 돈 버는 투자. 민주당 선거 영향·과매도 여부·정유주 전망은 '모른다'며 판단 보류."
      - "🔢 글 숫자와 이 표: 글의 2.0배 ≈ 표의 26E(올해 말 순자산) 기준. 표의 27E 가 1.5배보다 낮은 건 컨센서스가 27년 이익을 300조원보다 크게 봐서예요 (27E 주당순이익 약 7.3만원)."
      - "🐣 이익이 크게 늘 땐 앞으로 BPS(주당 순자산)가 빨리 불어나서 27E·28E PBR 이 낮아 보여요. 업황이 꺾여 추정이 내려가면 같은 가격에서도 PBR 이 다시 올라가요."
      - "🧱 증권사 시각(11/5, 12개월 선행 PBR): 이번 사이클 바닥은 1.4배인데 지금은 그걸 깬 '언더슈팅'. 사이클 동안 오른 밸류를 빼고 20년으로 봐도 바닥은 1.2배 — 이미 10% 안쪽만 남았다고 봄."
      - "⚠ 같은 시각: 25만원·10만원 같은 가격 맞히기는 의미 없고, 오히려 20만원 언저리에서 3~6개월 옆으로 기는(횡보) 게 걱정. 그 걱정거리는 AI 가 아니라 금융시장에서 찾아야 한다고 봄."
      - "🔢 두 글은 잣대가 달라요: 앞 글(0.7배 저평가)의 '지금 2.0배'는 올해 말 순자산(26E) 기준, 이 글(1.2배 바닥)은 앞 12개월 순자산(12MF) 기준 → 같은 주가라도 배수가 달라서 표의 12MF 열로 보세요."

  - name: SK하이닉스
    code: "000660"
    multiples: [0.7, 0.9, 1.0, 1.2, 1.5, 1.8]
    # 삼성전자 잣대를 그대로 대 봄 (사용자 11/5 "SK하이닉스도 참고") + 증권사 시각: 20년 바닥 1.0배, 이제는 삼성처럼 1.2배로 봐도 됨
    marks: [[0.7, 저평가, "내 기준 (삼성전자 잣대)"], [1.0, 매력적, "내 기준 (삼성전자 잣대)"], [1.0, 20년 바닥, "증권사 시각 · 12MF"], [1.2, 삼성과 같은 바닥, "증권사 시각 · 12MF"]]
    alert: {year: 28E, below: 1.0, text: "28E PBR 1배 이하는 기회라는 말이 있음"}
    # 📉 SK증권 '주가 고점·오더컷·하단 12MF P/B (2013-2023)' + '분기 영업이익' 그림 (사용자 11/14 "되게 좋다, 꼭 넣어줘, 트래킹도") — 상세 맨 위 + 신호 탭
    #   띠 = SK증권 숫자 · 선·지금 값·분기 영업이익 = 자동 · wins = 이 기간 주가가 가장 높은 주 = 고점, 13주 뒤 = 오더컷 자리 (그림의 '3M')
    cycle:
      src: "SK증권 그림 2장 (자료: Bloomberg, 사용자 전달 11/14)"
      bands: [{n: 고점, lo: 1.6, hi: 1.8, col: "#f2b800"}, {n: 오더컷, lo: 1.1, hi: 1.2, col: "#c8102e"}, {n: 하단, lo: 0.8, hi: 0.9, col: "#8c8c8c"}]
      wins: [["2014-10", "2015-12"], ["2017-10", "2018-12"], ["2021-06", "2022-09"], ["2026-01", "2026-12"]]
    scen:   # 📊 삼성전자 칸과 같은 표
      src: "유진투자증권 '삼성전자, SK하이닉스 시나리오별 밸류에이션' 표 (사용자 전달 11/14)"
      years: ["2025", 26E, 27E, 28E]
      base: {bps: [165544, 595217, 1143444, 1729538], eps: [58955, 415296, 588228, 686094], pbr: [3.90, 2.04, 1.06, 0.70], per: [11.00, 2.92, 2.06, 1.77]}
      bear: {bps: [165544, 595217, 1079576, 1265313], eps: [58955, 415296, 524359, 285737], pbr: [3.90, 2.04, 1.12, 0.96], per: [11.00, 2.92, 2.31, 4.24]}
    memo:
      - "레거시 반도체 시절 PBR: 업황 최악일 때 0.9배, 보통 1~1.8배, 평균 약 1.5배. 27년은 거의 확정된 실적으로 봄."
      - "📏 삼성전자 글의 잣대(0.7배 저평가 · 1배 매력적)를 그대로 대 봤어요. 10년 PBR 기록(아래 밴드 줄)이 삼성전자와 비슷한 범위라 같은 잣대로 비교할 만해요."
      - "🐣 하이닉스는 이익이 삼성전자보다 더 빨리 늘어서, 지난해 실적 기준 PBR 은 아주 높고 먼 연도(28E) 기준은 아주 낮게 나와요. 먼 연도일수록 추정이 틀릴 위험이 커요."
      - "🧱 증권사 시각(11/5, 12개월 선행 PBR): 20년 데이터로는 하이닉스 바닥이 1.0배(삼성전자는 1.2배) — 1.0배면 약 30% 더 빠질 여지. 하지만 HBM 이 마이크론보다 앞서고 삼성과의 격차·DRAM 로드맵 격차가 줄어서 옛 밸류를 그대로 대긴 무리 → 삼성전자와 같은 1.2배로 볼 수 있다고 함."
      - "⚠ 같은 시각: 가격 맞히기보다 횡보가 3~6개월 길어지는 게 걱정, 걱정거리는 AI 가 아니라 금융시장 쪽 (삼성전자 칸과 같은 글)."

