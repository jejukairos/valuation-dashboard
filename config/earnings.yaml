    body: |
      1️⃣ 실적 요약

      1. 재무성과
      — 매출 28조 7,738억 (YoY +40.1%, QoQ -1.3%) · 영업이익 3조 7,043억 (YoY +545.9%, QoQ +6.2%), 이익률 12.9%
      — 영업외 -1,904억 (환 +1,205 · 파생 -1,005 · 이자 -2,442 · 지분법 +919 · 기타 -581) → 세전 3조 5,138억
      — 순이익 2조 6,413억 · 순차입 19.6조 (연초 -3조) · 부채비율 170%

      2. 부문성과
      — SK에너지 1조 2,058억 (QoQ +5,546억) · SK엔무브 1조 906억 (역대 최대) · E&S 7,744억
      — SK어스온 314억 (+페루 926억 별도) · SK온 매출 1조 5,263억, 영업손실 -805억

      3. 가이던스
      — 숫자 없음 · 4Q 정유 견조(유가 급락 없으면), 윤활유·E&S 약해짐

      2️⃣ CFO (서건기) 하이라이트

      1. 새 계약⭐️
      ① SK온 네오볼타 ESS 약 9GWh · LFP 양극재 엘앤에프·포스코퓨처엠
      ② SK엔무브 HF 싱클레어 그룹3 장기 공급

      2. 베트남 황금낙타 9월 말 첫 생산
      ① 계획보다 앞당김, 회수 가능 약 6천만 배럴, 지분 25%

      3️⃣ 자회사별 설명

      1. 정유·화학
      ① 중동 불안·러시아 정유시설 공격으로 마진↑, 2Q 정기보수 끝나 가동↑
      ② 운임 급등은 일시적이라고 판단 · 화학 4Q 강보합

      2. 윤활유·E&S
      ① 엔무브: 공급 차질 풀리면 스프레드 축소, 그래도 21~23년처럼 방어
      ② E&S: 4Q SMP 하락·LNG 현물가 부담

      3. SK온
      ① 일회성 빼면 개선 중, 고정비 효율화
      ② 신규 증설 대신 EV 라인을 ESS로 전환

      4️⃣ Q&A 하이라이트

      1. 주주환원 (미래에셋증권)⭐️
      ① 밸류업 공시 포함 검토 중, 재무 안정 우선
      ② 시점·규모 답 없음

      2. 종전 뒤 윤활유 (신영증권)⭐️
      ① 올해 수준 이익은 쉽지 않다고 인정

      3. 4Q 정유 (신한투자증권)
      ① 싼 OSP 원유 → 유가 급락 없으면 견조

      4. 중국산 셀 대체 문의 (KB증권)
      ① 문의 증가는 사실, 실제 계약은 가격·납기 따라
