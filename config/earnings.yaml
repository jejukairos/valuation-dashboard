    body: |
      1️⃣ 실적 요약

      1. 재무성과
      — 영업이익: 분기 100조 원 돌파, 사상 최대 (정확한 금액·매출은 자막에 없음)
      — 영업이익률: 55% (전 분기 52%)
      — 순이익: 75.1조 원 (QoQ +5%)
      — EPS: 보통주 11,462원, 우선주 11,492원 (QoQ 각각 +6%, 사상 최고)
      — R&D 비용: 14.4조 원
      — 환율: 달러·유로 하락으로 부품 사업 중심 영업이익 QoQ 약 -10조 원
      — CAPEX: 29조 원 (QoQ +12.2조, YoY +19.8조) — DS 27.2조, 디스플레이 1.1조
      — CAPEX 누계(1~3분기): 56.9조 원 (YoY +24.7조) — DS 52.8조, 디스플레이 2.4조

      2. 부문성과
      — 메모리: DRAM 출하 QoQ +한 자릿수 초중반, NAND +한 자릿수 중반 · DRAM ASP +20% 수준, NAND ASP +10% 후반 · 역대 최대 분기
      — 시스템LSI: 모바일 수요 약세에도 SoC·2억 화소 센서로 매출 성장 이어감
      — 파운드리: 4나노 HBM 베이스 다이·선단 공정 판매로 매출 증가, 실적 큰 폭 개선
      — 디스플레이: 중소형 매출·이익 QoQ 증가, 대형 손익 개선
      — MX: 매출 37.3조 원 (QoQ·YoY 성장, 폴드8 효과) · MX+네트워크 영업이익 -0.6조 원 적자
      — VD(TV): 스포츠 이벤트 끝나 수요·매출 감소, 프리미엄·비용 절감으로 하락폭 제한

      3. 가이던스
      — 26년 연간 CAPEX 84.4조 원 (+31.7조) — DS 76.8조 (+29.3조), 디스플레이 3.9조 (+1.1조)
      — 4분기: DS 호실적으로 성장 지속, DX 는 원가 상승 부담 계속
      — 4분기 출하: DRAM QoQ +10% 중후반, NAND +10% 중반
      — 4분기 파운드리 매출 QoQ·YoY 두 자릿수 이상 성장 · MX 매출은 QoQ 감소
      — 27년: DS 덕분에 26년보다 좋은 실적 기대, DX 는 수익성 부담 지속

      2️⃣ 발표자 (IR팀장 다니엘 오 · 사업부 임원)

      1. HBM4 판매 확대로 역대 최대⭐️
      ① DS 는 HBM4 판매를 늘리고 서버 수요에 대응해 역대 최대 분기 실적을 다시 경신
      ② 27년 상반기 HBM4E 양산 시작, 하반기 물량 확대 · 8,000Mbps 이상 고속 DDR5 서버 수요 대응

      2. 메모리 공급이 수요를 못 따라감⭐️
      ① 클라우드 기반 개인 AI 에이전트 확산으로 QLC SSD 주문이 대량으로 들어옴
      ② 증산해도 수요가 계속 더 커서 HBM·서버 DRAM·SSD 비중을 한 단계 더 높일 계획

      3. 파운드리 가동률 100% 넘을 전망
      ① 27년 8나노 이하 수요가 생산능력을 크게 넘어 가동률 100% 상회 예상 · 8·4·2나노 증설 추진
      ② 26년 2나노 수주 과제 수 전년 대비 2배 이상 · 미국 테일러 1팹 가동 시작

      4. 스마트폰·TV 는 원가 부담
      ① 메모리 값이 올라 스마트폰 중저가 수량 감소, 대신 ASP·프리미엄 비중이 늘어 금액은 증가
      ② 27년 TV 수요는 정체 또는 소폭 감소, RGB OLED·75인치 이상 프리미엄 비중 확대

      3️⃣ CFO 박순철

      1. 분기 영업이익 100조 원⭐️
      ① 글로벌 1위 테크 기업 중 처음으로 분기 영업이익 100조 원 넘김
      ② 27년은 기록적인 AI 투자·공급 부족으로 반도체 강세가 이어질 것 — 메모리 수요가 공급을 크게 넘을 전망

      2. 3분기 배당 주당 4,601원⭐️
      ① 보통주·우선주 같은 금액, 정기 배당 376원 포함 · 총 30조 원 수준, 11월 지급
      ② 26년 전체 환원 90~110조 원 중 실행분 35조(이번 배당 30조 포함) 빼면 남은 재원 55~75조 원

      3. 남은 재원은 배당 + 자사주 소각⭐️
      ① 남은 재원은 현금 배당과 함께 상당 규모 자사주를 사서 소각
      ② 보통주·우선주 가격 차이 인식 — 자사주 매입 때 우선주 비중을 적극 조정하겠다고 약속

      4. 27년 이후 새 주주환원 정책
      ① 27년 이후 새 정책을 깊이 논의 중
      ② 27년 1월 말 이사회에서 새 정책 + 26년 남은 재원의 최종 규모·실행 방안 함께 발표

      5. 환율 대응
      ① 비싼 파생상품 대신 들어오고 나가는 통화를 맞추는 '내추럴 헷지'로 관리
      ② 남는 달러는 일찍 팔아 환율 노출 기간을 줄임

      4️⃣ Q&A 하이라이트

      1. 28년 메모리 시장 (KB-제프리스)⭐️
      ① 28년에도 공급 부족 지속 전망 — 27년 CAPEX 증가분은 대부분 건물·공간 확보라 28년 생산 증가로 바로 이어지기 어려움
      ② HBM4E·HBM5 는 다이가 커져 일반 DRAM 대비 생산 전환 비율이 높아짐 · 클린룸 먼저 짓고 설비는 수요 보며 탄력 도입

      2. 장기공급계약(LTA) (메리츠)⭐️
      ① 대형 고객 10곳과 계약 완료, 또 다른 주요 10곳과 협상 중(일부는 완료 단계) · 모바일·자동차·네트워크 고객까지 넓어짐
      ② 30년까지 생산능력의 60~70% 를 LTA 로 채운다는 목표가 더 현실화 · 연장 수요도 예상보다 크게 많음

      3. HBM 현황 (시티)⭐️
      ① 3분기 HBM4 매출 QoQ 3배 이상, HBM 중 HBM4 비중 60% 수준 · HBM 점유율을 DRAM 점유율 수준으로 올린다는 목표 3분기에 이미 달성
      ② 27년 HBM 물량은 목표 가격으로 협상 끝나 솔드아웃, 추가 증량 요청도 계속 들어옴

      4. 파운드리 수주·증설 (골드만삭스·BofA)
      ① 3분기에도 대형 CSP·AI HPC 고객 2나노 수주 확보 · 27년 HPC 매출 비중 50% 넘을 전망
      ② 증설 속도가 수요를 못 따라가 미국·국내 신규 팹 확대 · 테일러 1팹 설비 반입 시작, 추가 팹 검토

      5. AI 와 NAND (JP모건)
      ① 에이전틱 AI 로 KV 캐시가 빠르게 늘어 고성능 TLC SSD 수요 증가, 개인 AI 에이전트용 QLC SSD 수요도 사용자 수만큼 늘어남
      ② V10 TLC 3분기 양산 준비 완료, 256TB QLC 제품 내년 초 상용화 예정

