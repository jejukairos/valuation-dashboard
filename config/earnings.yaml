    body: |
      ※ 다시듣기가 끝났고 자막도 직접 못 읽어서 공시 + 컨콜 기사로 썼어요. Q&A 질문 증권사는 기사에 안 나와요.

      1️⃣ 실적 요약

      1. 재무성과
      — 매출 3조 4,139억 (YoY +12.9%, QoQ -37.3%) · 영업이익 4,857억 (YoY +67.6%, QoQ -34%), 이익률 14.2%
      — 순이익 1,451억 (YoY -46.1%, QoQ -79%) — 줄어든 이유는 기사에 없음
      — 1~3분기 누적 매출 12조 670억 (+27.6%), 영업이익 1조 6,629억 (+80.7%)

      2. 부문성과
      — 상선 2조 7,150억 / 4,718억 (17.4%) · 특수선 3,630억 / -706억 · 에너지플랜트 5,275억 / 914억 (17.3%)
      — QoQ 매출 급감은 2분기 해양 공사 매출을 인도 때 한꺼번에 잡은 기저효과

      3. 수주
      — 신규 수주 1~9월 77.2억$ (기사마다 척수 38~44척으로 다름)
      — 수주잔고(남은 일감) 9월 말 165척·362.2억$

      2️⃣ 재무 (한상윤 전무)

      1. 4분기 일회성 비용⭐️
      ① 일시타결금·성과급 반영으로 수익성 다소 낮아질 수 있음
      ② 6월부터 환헤지 확대 → 환율 영향 줄여 나감

      2. 수익성 방어
      ① 상선의 견조한 수익성이 바탕
      ② 특수선·플랜트는 원가 절감과 계약 변경으로 보완

      3️⃣ 사업부 (상선 김영기 팀장 · 특수선 김윤주 상무 · 플랜트 조용석 장)

      1. 상선
      ① LNG선·VLCC 중심 골라 받기, 선종 다변화
      ② 4분기 수준 수익성 내년에도 유지 전망

      2. 특수선⭐️
      ① 고정비 부담·일부 호선 원가 상승으로 적자 확대
      ② KDDX 상세설계·선도함 수주, 핵잠 대응 '장보고N개발단' 신설

      3. 에너지플랜트
      ① FPSO 변경계약·드릴십 용선 수익으로 흑자
      ② FLNG·파워플랜트로 영역 확대

      4️⃣ Q&A 하이라이트 (질문 증권사는 기사에 안 나옴)

      1. 특수선 수주 목표⭐️
      ① 올해: 태국 호위함 계약 완료
      ② 내년: 국내 지원함·전투용 무인수상정, 에스토니아·그리스 OPV

      2. 미국 필리조선소
      ① 지배구조 변경으로 영업이익 직접 수혜는 없음, 간접 효과
      ② 거제에서 첫 배 → 후속선 미국 이전 '브릿지' 전략 검토

      3. 증권가 반응 (리포트)
      ① 목표가 하향: 하나 10만·SK 11→9만·현대차 10→7.4만, LS 9만 유지
      ② 이유: 상선 고점 우려·특수선 수익성 둔화
