      ② 금액은 말하지 않음

      2. 이익률 12.4% 의 의미
      ① 환율·음반 발매 감소·공연 비중 확대 속에서 지킴
      ② 솔루션(MD 등) 롱테일 매출이 이익을 받침

      3. 위버스 결제 감소
      ① 아티스트 활동이 오프라인 투어로 몰린 탓
      ② MAU 는 2분기 최대 기저에도 비슷하게 지킴

      4️⃣ Q&A 하이라이트

      1. BTS 내년 하반기·2028년 이후 (하나증권)⭐️
      ① 1년 뒤 계획 공개는 없다 · 추가 콘서트 공개 예정
      ② 투어 끝난 뒤 단체·솔로 준비 중, 계약 기간 답 없음

      2. 경쟁 심해짐·캣츠아이 반복 가능? (HSBC)
      ① 인기와 '슈퍼팬 경제'는 다르다, 동남아 인큐베이팅 중
      ② 팬덤 만드는 법을 알아 반복 가능하다고 봄

      3. 인건비 1,500억대 계속? (NH투자증권)⭐️
      ① 인원은 크게 안 늘고 성과급 충당금을 보수적으로 쌓음
      ② 이익이 나빠지면 그만큼 안 생길 돈

      4. 코르티스 내년 공연 (NH투자증권)
      ① 올해 공연장은 데뷔 전에 잡아 작았다
      ② 다음엔 연차 높은 그룹 수준의 큰 공연장
