      — 순이익(OpenAI 영향 제외): 364.2억 달러 (YoY +18%), 희석 EPS 4.89달러 (+18%) ⭐️
        · 이번 분기 OpenAI 투자 이익 2.07억 달러(EPS +0.03), 1년 전엔 손실 31억 달러(EPS -0.41) → GAAP 증가율이 부풀어 보임
      — 마이크로소프트 클라우드 매출: 639억 달러 (YoY +30%, 환율 제외 +31%)
      — 상업용 남은 계약 잔고(RPO, 앞으로 받을 계약 금액): 6,770억 달러 (YoY +73%) ⭐️
      — 영업활동 현금흐름: 580억 달러 (YoY +29%)
      — CAPEX(유형자산 취득, 현금 기준·금융리스 제외): 393.7억 달러 (1년 전 193.9억 달러, 약 2배) ⭐️
      — Free Cash Flow: 186.3억 달러 (YoY -27%)
      — 현금 및 단기투자: 645.1억 달러 (6월 말 768.4억 달러) / 총부채 3,088.9억 달러
      — 주주환원: 102억 달러 (배당 + 자사주 매입)

      2. 부문성과 (9월 발표한 새 부문 기준, 작년 숫자도 새 기준으로 다시 계산)
      — 에이전트·인프라: 매출 768.0억 달러 (YoY +25%), 영업이익 405.6억 달러 (+24%), 영업이익률 52.8%
        · 애저: 331.7억 달러 (YoY +48%, 직전 분기 +42%에서 가속) ⭐️
        · 마이크로소프트 365 클라우드: 277.8억 달러 (+17%) — 상업용 +17%(작년 일시 효과 빼면 +18%), 개인용 +17%
        · 생산성·서버 라이선스: 84.1억 달러 (-3%)
        · 산업 솔루션: 53.4억 달러 (+9%), 그중 클라우드 +10%
        · 프런티어·지원 서비스: 21.1억 달러 (+4%)
      — 기기·소비자: 매출 154.8억 달러 (YoY -3%), 영업이익 53.6억 달러 (+2%), 영업이익률 34.6%
        · 검색·광고: 65.5억 달러 (+10%), 트래픽 획득 비용 빼면 +12%
        · 엑스박스(XBOX): 53.8억 달러 (-2%), 콘텐츠·서비스 -2%
        · 윈도우 OEM·기기: 35.5억 달러 (-22%) ⭐️

      3. 가이던스 (보도자료에는 없음 — 어닝콜 내용을 전한 언론 보도 기준, 회사 원문은 확인 못 함)
      — 2분기 애저 성장률: +49~50% (환율 영향 제외)
      — 2분기 CAPEX: 500억 달러 이상
      — FY27(26년 7월~27년 6월) CAPEX: 약 1,700억 달러로 늘어나도 잉여현금흐름은 플러스 유지

      4. 경영진 한마디 (보도자료 인용)
      — CEO 사티아 나델라: "고객에게 전체 기술 스택에 걸쳐 더 많은 기능·선택권·통제권·비용 효율을 주고 있다"
      — CFO 에이미 후드: "마이크로소프트 클라우드 매출 639억 달러로 회계연도를 힘차게 시작했다"

