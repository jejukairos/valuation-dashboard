    body: |
      1️⃣ 실적 요약 (부문 매출·광고 노출·단가 그래프는 위 🔑 핵심 지표 · 📊 실적 요약)

      1. 재무성과
      — 매출 646억$ (+26%) · 광고 631억$ (+26%, 노출 +10%·단가 +14%) · 기타 11억$ (+59%, 왓츠앱 유료 메시지)
      — 영업이익 130억$ (-37%), 이익률 20% · ⚠ 주정부 합의 비용 99억$ 빼면 +11%
      — 순이익 99억$, EPS 3.83$ · 세율 24%
      — CapEx 349억$ (금융리스 포함) → FCF -21억$ · 현금 824억$ / 부채 837억$
      — 직원 6.6만 명 (5월 감원으로 2분기 대비 -12%)

      2. 가이던스
      — 4분기 매출 730~760억$ · 26년 총비용 1,750~1,790억$ (법무 비용 반영 상향)
      — 26년 CapEx 1,350~1,450억$ (하단 상향) · 리얼리티랩 적자 26년 180~190억$ → 27년 약 150억$
      — 27년 숫자는 4분기 실적 때 · "27년 내내 강한 매출 성장" 자신

      2️⃣ CEO 마크 저커버그

      1. 개인 AI 비서 Muse 흥행⭐️
      ① 6주 만에 미국·캐나다 1,000만 명, 매일 쓰는 비율 약 25% (스레드 초기의 2배+)
      ② 1위 용도는 쇼핑(4분의 1 이상, 평균 구매 200$+), 여행 계획도 많음

      2. Muse 돈 버는 법
      ① 대부분 무료 + 거래 수수료(기업 부담) · 고급 기능은 개인·기업 구독
      ② 연산비가 비싸 1년 안에 효율 10배+ 목표 → 몇 년 뒤 고수익 사업 기대

      3. 자체 AI 모델·기업 사업
      ① 첫 최첨단 모델 Muse Wonder 출시, 더 큰 모델 학습 중 · 싼 작은 모델도 곧
      ② 기업용 플랫폼(API·Muse Code·비즈니스 에이전트)으로 추론 수요를 최대한 받기

      4. 리얼리티랩
      ① 다음 달부터 메타 안경에 Muse 탑재 — 기기보다 그 위 소프트웨어·구독으로 수익
      ② VR 은 큰 기술 돌파 때만 새 기기 → 투자 우선순위를 메타버스에서 AI 로

      5. 실행 속도
      ① Muse 는 아이디어→출시 약 8개월, Muse Charm 기기 1년 안에 · Edits 5,000만 명
      ② 페이스북·인스타 참여 사상 최고, 스레드 월간 이용자 X 추월, 하루 이용자 36.4억 명

      3️⃣ CFO 수전 리

      1. 참여도·추천
      ① 인스타 1인당 이용시간 사상 최고, 릴스 시청시간 +4% (추천 개선)
      ② 콘텐츠 이해 모델을 자체 Muse 로 바꿔 처리 비용 80%+ 절감

      2. 광고 효율
      ① GEM 확대로 앱 광고 전환 +9.6%, 생성형 추천 광고로 전환 약 +2%
      ② 생성형 광고 도구(Advantage+: 이미지·영상·음성) 쓰는 광고주 약 1,000만

      3. 새 매출원⭐️
      ① 크리에이터 협업 광고 +97%, 연 매출 150억$ 돌파 · 통합 구독 Meta One 1,500만 건
      ② 소상공인 5억 곳이 Muse 기업 기능의 잠재 고객 · 27년부터 AI 구독·거래·기업용 매출 기여 시작

      4. 비용과 투자
      ① 27년 예산은 아직 짜는 중 — 핵심 사업·AI(MSL) 모두 공격적 투자 지속
      ② AI 투자가 이미 광고 매출을 늘리는 중 · 27년 비용·CapEx 숫자는 4분기 때

      5. 의결권 없는 새 주식
      ① 1주당 1주 배당 → 사실상 2:1 분할, 27년 1월 말 거래 시작
      ② 자금 조달·보상·인수 유연성(창업자 지배 유지), 당장 조달 계획은 없음

      4️⃣ Q&A 하이라이트

      1. Muse 걸림돌은 연산비 (모건스탠리)
      ① 비싸서 아직 전 세계 출시 못 함 — 10억 명 서비스할 연산이 내년 최대 과제
      ② 무료 Muse Spark · 유료 Muse Wonder → 더 싼 Wonder 로 넓게 출시

      2. 기업용 AI (모건스탠리)
      ① 모델 API·Muse Code·비즈니스 에이전트 셋 다 빠르게 성장 · 쇼피파이·퀵북스 연동
      ② 개인 AI ↔ 기업 AI 가 직접 거래하는 'Muse Network' → 구독·API·거래 반복 매출

      3. AI 쇼핑 (골드만삭스)
      ① 기업들이 먼저 Muse 연동을 요청해 옴
      ② 월마트·스트라이프·쇼피파이와 에이전트 거래 표준 'Personal Agent Protocol' — 거래 가치 일부를 수익으로

      4. 27년 비용·CapEx (JP모건)
      ① 좋은 투자안이 많아 예산 안에서 최대한 집행 검토 · 숫자는 4분기 때

      5. 수익화 속도 (에버코어)⭐️
      ① 연산비가 커서 예전 소셜 앱보다 빨리 수익화 (거래에서 일정 비율)
      ② 유휴 연산·작은 모델·추론 최적화로 GPU 활용률 ↑ → 1년 뒤 같은 성능을 훨씬 싸게
