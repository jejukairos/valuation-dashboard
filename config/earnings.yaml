      ② "1조 달러 매출 사업이 5~10년 안에 두 개 나올 수도"

      3️⃣ 어닝콜 — CapEx·AI 인프라 (CEO 재시·CFO 올사브스키, 녹취록 대조)

      1. CapEx·투자 계획⭐️
      ① 3분기 현금 CapEx 759억$ (설비 매각·보조금 뺀 값, 총액은 773억$) — 대부분 AWS·AI
      ② 26년 현금 CapEx 약 2,200억$ (대부분 AWS) · 27년은 "상당히 더" 쓸 계획
      ③ AI 는 일생일대의 기회 — AWS 선두를 지키려 계속 투자, 자금 조달 가능, 길게 보면 매출·FCF 를 크게 키움
      ④ 투자 회수 기간·손익분기 시점을 계속 앞당기고, 장비 내용연수도 늘리는 중

      2. AWS 성장·데이터센터 증설
      ① AWS +39.3% (6분기 연속 가속), 연 매출 규모 1,840억$, 잔고 5,780억$ (세 자릿수 % 증가)
      ② AI 가속기를 약 14초마다 1개 설치 — 늘린 용량을 고객이 바로 씀
      ③ 앞으로 8~10개 분기 큰 증설 · 고객이 수백 MW~1GW 씩 미리 예약 · 27·28년(29년 일부) 수요 가시성 높음
      ④ EC2·Bedrock 의 그때그때 수요용 용량도 따로 확보 · 27·28년 AWS 각각 40%+ 성장, 5~10년 안에 연 매출 1조$ 가능

      3. AI 수요
      ① AWS AI 매출 세 자릿수 성장 · 추론이 AI 매출의 절반을 훨씬 넘고 계속 늘어남 (학습 매출도 큼)
      ② AI 가 늘수록 기존 컴퓨팅·저장·네트워크 사용도 같이 늘어남
      ③ Bedrock: 포춘500 지출 약 7배, 토큰 약 17배 — 언젠가 EC2 만큼 커질 수 있음 · 기업 추론 도입은 아직 초기

      4. 자체 칩 (트레이니엄·그래비톤)
      ① 자체 칩 매출 세 자릿수 성장, 매출 약정 각각 20배+ · Bedrock 일 대부분이 트레이니엄에서 돎
      ② 그래비톤: x86 보다 가격 대비 성능 30~40% 좋음, 이전 세대 잔고도 2배+ · 자체 칩 고객 3분기 20억$+ 절약
      ③ 트레이니엄 27년 말부터 외부 판매 — 단, AWS 안에 두면 5~6년 동안 더 큰 누적 매출·FCF

      5. 수익성·비용
      ① AWS 영업이익 178억$, 이익률 38.7% — AI 사업 이익률이 예전 클라우드의 같은 성장 단계보다 높음
      ② ⚠ 메모리 등 부품 값 상승과 감가상각비가 부담 → 자체 칩·자체 네트워크·용량 최적화로 줄이는 중
      ③ 데이터센터는 대부분 직접 소유·장기 임차 — 네오클라우드 방식은 영업이익률이 약 35%p 낮다고 설명

      👉 정리: 설비투자 대부분이 AI 로 가고, AI 매출은 세 자릿수 성장, 추론은 아직 초입. 반도체(메모리·장비)에 나쁜 말은 없었음 —
