      2. 유튜브·쇼핑
      ① 유튜브 광고의 3분의 1 이상이 TV 화면에서 · 쇼핑 채널 130만 개, 아마존 상품 연결
      ② AI 에이전트 결제 표준(UCP·Agent Payments Protocol) 도입, 수십만 브랜드 직접 결제

      4️⃣ 클라우드 CEO 토마스 쿠리안

      1. 기업 AI 확산⭐️
      ① 연 매출 10억$ 넘는 제품 18개 · Fortune 100 의 약 90% 가 Gemini Enterprise 사용
