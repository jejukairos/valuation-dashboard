    body: |
      1️⃣ 실적 요약

      1. 재무성과
      — 매출 7,731억 원 (+100% YoY), 2분기에 이어 분기 최대 · 예상(7,861억)보다 조금 적음
      — 영업이익 1,606억 원 (+69% YoY), 이익률 20.8% · 예상(1,814억)보다 적음
      — ⚠ 환율: 분기 중 달러·유로가 원화 대비 약 14% 하락 → 영업이익 약 278억, 이익률 3.6%p 깎임
      — IFRS 18호 조기 적용으로 외화 매출채권 손실이 영업이익에 들어감 · 옛 기준이면 영업이익 1,767억(22.9%)

      2. 부문별
      — 화장품·뷰티 6,823억 (+151%) · 2025년 1분기부터 7개 분기 연속 세 자릿수 성장
      — 디바이스 847억 (-18%) · 큰 글로벌 할인 행사가 없던 영향, 누적 판매 800만 대 돌파
      — 기타 61억 (-42%) · 핵심 아닌 사업 줄임
      — 해외 7,229억 (+135%), 비중 94% (1년 전 80%) · 북미+유럽 비중 69% (1년 전 47%) · 한국은 약세

      3. 가이던스
      — 26년 매출 3조 원·영업이익 7,300~7,500억 원 목표 유지
      — 27년 가이던스는 4분기 실적 발표 때 공개, 매출 목표는 공격적으로 잡을 계획

      2️⃣ 발표자 — 신재하 부사장

      1. 환율이 이익을 깎았다⭐️
      ① 원화 강세로 외화 매출채권 평가손실 + 해외 매출의 원화 환산 감소가 동시에 발생
      ② 원가는 대부분 원화라 매출만 줄어든 효과 → 이익률 부담

      2. 10월 아마존 행사 역대 최대⭐️
      ① 미국·유럽 주요 시장에서 역대 최대 일 매출, 미국 아마존 뷰티 탑 100에 13개 제품
      ② 이탈리아 아마존 뷰티 상위 11개 중 8개가 메디큐브

      3. 제품이 고르게 팔린다
      ① 제로모공패드 등 기존 인기 제품에 멀티밤·머드팩·바디케어 같은 올해 신제품이 가세
      ② 연말 쇼핑 시즌에 신제품·유통 채널 확대로 성장 이어갈 계획

      3️⃣ 커뮤니케이션실 차태영 차장 (비용·채널)

      1. 판관비 비중
      ① 판매수수료 약 17% (큰 행사가 없어 1·2분기 17~18%보다 소폭 감소), 운반비 약 9%
      ② 항공 운송비 상당 부분은 재고 → 매출원가로 잡혀 운반비 계정에 다 안 보임

      2. 오프라인 판매는 진짜로 팔린다
      ① 매장에서 실제 소비자에게 팔리는 양(셀스루)이 늘어 재주문이 계속 들어옴
      ② 유럽 일부 매장은 딜러·유통사를 통해 들어감

      4️⃣ Q&A 하이라이트

      1. 올해 목표·4분기 환율 (시티그룹)⭐️
      ① 3조 원은 넘길 가능성이 더 높다고 봐 매출 목표 유지, 영업이익 7,300~7,500억도 지금은 안 바꿈
      ② 4분기 누적 평균 환율이 3분기보다 낮아 부담 · 연평균 환율로 인식해 1·2분기 이익 일부가 깎일 수도

      2. 이익률을 지킨다는 뜻인가 (HSBC)⭐️
      ① 이익률보다 영업이익 금액(7,500억 원) 목표를 지키겠다는 뜻
      ② 4분기 이익률은 지금 예측하기 어렵다

      3. 가격 인상·환헤지 (모건스탠리·교보)
      ① 가격 조정 전략은 아직 정하지 않음 — 내년 초까지 환율 영향을 신중히 분석
      ② 소비자 판매가 많아 환헤지는 어려움, 대신 매출채권 회수 기간을 줄이는 중

      4. 물류비·재고 (한화투자증권)
      ① 항공 운송비가 3분기에도 크게 줄지 않음 · 3분기 말 재고 약 5,000억 원
      ② 미국·유럽 안전재고를 쌓아 내년 초부터 항공 의존도가 점점 낮아질 것으로 예상

      5. 미국 채널·순위 (모건스탠리·다올투자증권)
      ① 얼타·타겟·월마트·코스트코·CVS 입점, 미국은 세포라 빼고 목표 채널 대부분에 들어감 · 긴급 발주도 들어옴
      ② 북미 온라인 7 : 오프라인 3 (오프라인 비중 늘어남), 유럽 6 : 4 · 얼타·타겟 스킨케어 상위 5위권
