      — 영업 밖 손실 9,872억 → 세전 -2,312억 → 순손실 -2,969억 (1년 전 +5,361억)
      — EBITDA 약 2조 · CapEx 약 1조 · 현금 4.3조 (QoQ -2.9조) · 부채비율 171%, 순차입금비율 82%
