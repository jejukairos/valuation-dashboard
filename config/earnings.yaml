      ② 아이폰 18 프로: A20 프로 칩, 역대 가장 큰 배터리 개선

      2. 시리 AI
      ① 9월 미국 영어 베타 → 10월 한국어 등 5개 언어 추가
      ② 지금은 '부탁하면 해 주는' 방식 — 개인정보를 지키며 기능 늘릴 것

      3. 맥·새 기기
      ① 터치되는 맥북 프로, M6 아이맥, OLED 아이패드 미니
      ② 활성 기기 25억 대+ · 미국에 4년 6,000억$ 투자 약속

      3️⃣ CFO 케반 파레크

      1. 이익률⭐️
      ① 환급 빼면 회사·제품 이익률 모두 지난 분기보다 약 1%p 낮음 — 메모리 탓
      ② 서비스 이익률 76% (지난 분기보다 +0.4%p)

      2. 주주환원·현금
      ① 분기 280억$ 돌려줌: 자사주 240억$ · 배당 39억$ · 배당 주당 0.27$
      ② 순현금 0 은 더 이상 목표 아님 — 전략 투자 여유

      3. 공급·환율
      ① 지난 분기 대비 환율 약 -2%p · 아이폰·맥·아이패드 공급 부족
      ② 관세 환급은 대부분 다 받음

