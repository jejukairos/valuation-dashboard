      — 국내: 13만 1천 대 (-27.2%, 추석·파업·신차 지연) · 하이브리드 비중 29.4% (+3.7%p)
      — 전동화: 하이브리드 +3.8%, EV -9.2% → 합계 245,540대 (-2.7%) · 글로벌 하이브리드 비중 18.2%
      — 자동차 부문: 매출 -10%, 영업이익 +24.8% (환율·원가 절감)
      — 금융 부문: 매출 +27.8%, 영업이익 -18.2% (이자 비용 증가)
      — 현대캐피탈: 상품 자산 +2.4%, 영업수익 +2.8%, 영업비용 +5.8% → 영업이익 -26%, 세전이익 -25%
      — 현대캐피탈 아메리카: 상품 자산 +5%, 영업수익 +24%, 영업비용 +26% → 영업이익·세전이익 -22% · 프라임 고객 90%

      3. 가이던스 (26년 연간)
      — 도매 판매: 415.8만 대 → 400만 대
      — 매출 성장: +1~2% 유지
      — 영업이익률: 5.5~6.5% 로 조정 (원자재·생산 차질·원화 강세 반영)
      — 자동차 투자: 17.8조 → 16조 원 (CapEx 중심 1.8조 효율화)
      — FCF: -1조~0.5조 원 유지
      — 4분기: 원가 부담 계속, 9월 생산 정상화 + 신차로 물량 회복 기대

      2️⃣ 발표자 (IR실장 윤태식 상무)

      1. 미국은 소매 판매 증가⭐️
      ① 미국 산업 수요가 줄었는데도 소매 판매 +3.5%, 점유율 6.6%
      ② 6개 분기 연속 점유율 6%대, 하이브리드 비중 26.8%

      2. 파업·연휴로 판매 감소
      ① 글로벌 도매 -11.3%, 국내 -27.2% — 추석 연휴·파업으로 신차 출시 지연
      ② 4분기 생산 정상화와 신차로 판매 회복 추진

      3. 판매 줄어도 이익은 늘어⭐️
      ① 물량·믹스는 마이너스였지만 환율과 원가 절감(컨틴전시)이 상쇄
      ② 매출원가율 83.8% (-1.7%p)

      4. 순이익은 감소
      ① 영업외손익 -71% 로 순이익 -24.2%
      ② 판매관리비는 판매보증 충당부채 감소로 -19.2%

      3️⃣ CFO (재경본부장 이승조 부사장)

      1. 생산 차질의 영향⭐️
      ① 2분기 부품사 화재에 3분기 휴가·추석·파업이 겹쳐 생산이 계획보다 크게 모자람
      ② 물량 감소 영향 약 -1.1조 원 (중동 판매 감소 포함)

      2. 원자재값 부담 계속
      ① 3분기 원자재 부담 약 5,000억 원 — 철판·알루미늄·플라스틱은 2분기가 꼭대기, 지금은 내려가는 중
      ② 실적에 늦게 반영되고 구리는 아직 오르는 중이라 4분기에도 부담

      3. 연간 목표 낮춤⭐️
      ① 도매 400만 대, 영업이익률 5.5~6.5% 로 조정
      ② "본질적인 사업 경쟁력이나 수익 창출력의 악화를 의미하는 것이 아니다" — 통제하기 어려운 일을 현실적으로 반영

      4. 투자 줄이고 현금은 지킴
      ① 자동차 투자 17.8조 → 16조 원, 핵심 R&D 는 유지
      ② FCF -1조~0.5조 원 구간 유지

      5. 3분기 배당 2,500원
      ① 보통주·우선주 주당 2,500원
      ② 기준일 11월 30일, 지급일 12월 30일

      4️⃣ Q&A 하이라이트

      1. 주주환원 (삼성증권·메리츠)⭐️
      ① 24년에 밝힌 자사주 4조 원 매입은 관세(작년 약 4조, 올해도 비슷) 등 환경 변화로 다시 검토 중, 끝나면 공유
      ② 그때까지 최소 배당 1만 원은 지킴

      2. 순이익이 낮은 이유 (메리츠·키움)⭐️
      ① 3분기 환율 급락으로 외화 매출채권에서 환산·환차 손실이 대부분, 지분법 이익 감소는 작음
      ② 법인세 약 1조 원은 지역별 이익 비중이 바뀐 탓, 4분기에 크게 달라지지 않을 것

      3. 원가 절감 (삼성증권)
      ① 영업이익 '기타' 증가분은 매달 하는 비용 절감·재료비 절감(컨틴전시)
      ② 원가 절감 효과는 4분기에 더 커질 것

      4. 금융 부문 이익 감소 (유안타)
      ① 장기 금리가 올라 조달 비용 증가, EV 중심 중고차 값 하락으로 반납 차량 매각 손실
      ② 연체율·대손 비용도 조금씩 상승 · 판매 가격을 내린 건 아님

      5. 중국차 대응 (메리츠)
      ① 수시로 값을 내리지 않고, 현대캐피탈의 잔존가치 유예할부로 월 납입금을 낮게
