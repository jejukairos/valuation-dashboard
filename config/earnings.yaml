    facts:
      - "⚠ 추석 연휴로 일한 날 14일 감소(영업이익 약 -500억)·환율 하락(약 -450억)·임단협 비용 75% 선반영 — 대부분 한 번만 있는 일"
      - "발전 엔진 수주: 공시 1.6GW + 공시 안 한 약 1.4GW · 하이퍼스케일러가 직접 연락해 논의 중"
      - "올해 세계 신조 발주 약 1.9억 톤 — 2007년(1.76억 톤) 넘어 역대 최대, 내년은 약 30% 줄어도 예년보다 많을 전망"
