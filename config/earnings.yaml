      ② 자체 AI 칩(TPU) 시스템도 다양한 고객에게서 수요가 강함

      2. 검색 성장 가속
      ① AI 투자 덕분에 전체 검색량과 쇼핑 같은 상업적 검색이 함께 늘고 있음
      ② 검색 질의 증가율이 5년 만에 가장 빠름

      3. 제미나이 모델·앱⭐️
      ① 제미나이 4 Argon·Carbon 모델이 지금 최고 수준(프런티어)에서 앞서 있음, 자체 모델 API 처리량 분당 약 320억 토큰 (1년 전의 4배 이상)
      ② 제미나이 앱 이용자 10억 명 — 구글 역사상 가장 빨리 큰 제품 · 유튜브 뮤직·프리미엄 구독 1.5억 명(체험 포함) 돌파

