      3️⃣ CBO 필립 쉰들러 (광고)

      1. 제미나이로 광고 효율 ↑
      ① 제미나이 광고 소재 생성 15억 개 (YoY 7배+), AI Max 쓴 광고주 전환 +52% 사례
