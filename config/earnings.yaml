      ① 9월은 TSMC 첨단 공정, 12월은 메모리 부족으로 맥·아이패드 제약
      ② 아이폰 듀오는 수요·공급이 언제 맞을지 예측 어렵다

      3. 중국
      ① 중화권 +21% — 아이폰·맥이 이끎

