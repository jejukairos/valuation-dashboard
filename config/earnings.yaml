    short:
      - "매출 280억$ 제자리(-0.2%), 영업이익률 2.6% 로 반토막 — 연구개발·신사업 준비 비용 증가. FCF 15억$(-62%)"
      - "수요 > 생산능력: 주문잔고 4년 최고, 북미 신차 75% 가 유료 FSD, FSD 고객 170만 명"
      - "에너지 매출총이익률 33% 로 급등 (관세 환급 등 일회성 포함), 메가팩 27년 물량 대부분 판매"
