      - "순이익 39.8조: 환율 손실 11.6조·투자자산 평가손실 22.9조로 영업외 -32.6조 · 순현금 98.7조"
      - "26 회계연도 주주환원 약 100조 (배당 30조+, 자사주 60조+) · 3분기 배당 주당 2만원 (키옥시아 특별배당 1만원 포함)"
      - "LTA 14개 고객, 27·28년 생산능력 50% 이상 확보 · 협의 물량까지 2029년까지 DRAM·HBM 사실상 매진"
      - "4분기 DRAM 출하 +20% 중반, HBM4 가 HBM3E 를 넘어 주력 · 내년 HBM 가격 협상 완료, 일반 DRAM 과 수익성 격차 축소"
