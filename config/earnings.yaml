      1️⃣ 실적 요약

      1. 재무성과
      — 매출액: 1,276억 달러 (YoY +25%, 환율 영향 제외도 +25%) · 연간 매출 규모 약 5,000억 달러
      — 영업이익: 406억 달러 (YoY +30%), 영업이익률 32% (1년 전 31%)
      — 영업외손익: -82억 달러 (1년 전 +128억 달러) · 보유 주식 평가손실 87억 달러 (1년 전엔 평가이익 107억 달러)
      — 순이익(보통주 몫): 262억 달러 (YoY -25%), 희석 EPS 2.12달러 (1년 전 2.87달러) · 평가손실 영향 EPS -0.55달러
      — 세율: 약 18% (1년 전 약 20%, 보도자료 숫자로 계산)
      — CAPEX(설비투자): 514억 달러 (YoY +114%)
      — 영업현금흐름: 423억 달러 (YoY -13%)
      — Free Cash Flow: -91억 달러 (최근 12개월 합계는 197억 달러)
      — 현금 및 유가증권: 2,651억 달러 (25년 말 1,268억 달러) / 장기부채 1,251억 달러 (25년 말 465억 달러)
      — 자금 조달: 회사채 287억 달러, 수시 신주 발행(ATM) 124억 달러(남은 한도 276억 달러), 의무전환 우선주 191억 달러(올해 누적)
      — 이자비용: 9.7억 달러 (1년 전 1.4억 달러) · 감가상각비 YoY 약 +49%
      — 주주환원: 자사주 매입 0 (1년 전 115억 달러), 배당 29억 달러 · 다음 배당 주당 0.22달러 (12월 14일 지급)
      — 직원 수: 20.5만 명 (1년 전 19.0만 명)

      2. 부문성과
      — 검색 및 기타: 634억 달러 (YoY +12%)
      — 유튜브 광고: 112억 달러 (YoY +9%)
      — 네트워크: 75억 달러 (YoY +1%)
      — 구독·플랫폼·기기: 143억 달러 (YoY +11%)
      — 구글 서비스 합계: 963억 달러 (YoY +11%) · 영업이익 392억 달러 (YoY +17%), 이익률 약 41%
      — 구글 클라우드: 307억 달러 (YoY +103%)⭐️ · 영업이익 111억 달러 (1년 전 36억 달러), 이익률 약 36%
      — 기타 사업(웨이모 등): 매출 3.7억 달러, 영업손실 20.5억 달러 (1년 전 -14.3억 달러)
      — 알파벳 공통비용(AI 공동 연구개발 등): 영업손실 76.6억 달러 (1년 전 -44.7억 달러)
      — 트래픽 획득 비용(TAC): 164억 달러 (YoY +10%)

      3. 가이던스
