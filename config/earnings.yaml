# 실적발표(컨퍼런스콜) 요약. 종목 코드(티커) 아래에 분기별로 쌓아요 — 최신이 위로.
#   quarter: 분기 이름 (예: 3Q26)
#   date: 발표일 (모르면 비워도 돼요)
#   source: 어디서 가져왔는지
#   easy: 🐣 주린이를 위한 핵심 간단 요약 3~4줄 (초등학생도 알아듣게, 숫자는 꼭 필요한 것 1~2개만, 맨 위에 보여요)
#   vs: 📋 실적 vs 예상 [{k 항목, a 실적, e 예상, u 단위 "$B"·"$"·"%"·"조", n: true 면 많고 적음이 좋고 나쁨이 아닌 항목(CapEx·감가상각비)}]
#   guide: 🧭 가이던스 같은 모양 (a·e 는 글자도 돼요, b 로 '상회'·'하회'·한마디 직접) · after: 발표 뒤 주가 ("-10%")
#   facts: 🆕 뉴팩트 — 이번 발표에서 새로 나온 사실을 ■ 한 줄씩 (일회성은 ⚠ 로 시작)
#   diff: 🔄 바로 이전 컨콜과 달라진 점 [{k 항목, b 지난 콜, a 이번 콜, t: good|bad|same|new|gone|num, note}] — 보유종목은 꼭 (지난 콜 자막과 나란히 읽고)
#         t: good 좋아짐 · bad 나빠짐 · same 그대로 · new 이번에 처음 · gone 지난번엔 말했는데 이번엔 말 안 함 · num 가이던스 숫자로 다시 계산한 것
#         diff_from: "2Q26" (비교한 콜, 비우면 바로 아래 분기)
#   voice: 🎙 말투·뉘앙스 [{k 주제, v: 확신|조건부|애매|회피|미룸, q 실제로 한 말(짧게), note 왜 그렇게 봤나}] — 단정했나·조건을 달았나·흐렸나·질문을 비켜 갔나
#   qa: 💬 질의응답 [{f 증권사, q 질문 짧게, a 회사 답 한 줄, v 말투(voice 와 같은 말)}] · qa_u = 주식봇 요약·전문 링크 (jusikbot.com/concall 목록의 '보기')
#       — 질문이 어디에 몰렸나(= 시장의 걱정) 와 답을 피했나를 한눈에. 주식봇 요약은 맞춰 보기용, 글은 우리 말로 줄여서
#   crowd: 👥 개인투자자 분위기 (사용자 판단) {v 한 단어, lines} — 맨 위 분기에 적으면 '시장 기대감' 바로 아래 빨간 상자
#   miss: 🙊 이번 콜에서 안 나온 것 [한 줄씩] — 질문도 회사 설명도 없었던 큰 이슈 (논란·주주환원·지난번 숫자 목표 등)
#   ndr: 📞 비공개 행사(NDR·그룹콜·프리뷰 콜) [{d, t, lines [알려진 것], after 그 뒤 주가, u [{t, u}]}] — 원문이 없으니 기사·리포트로 알려진 것만, 확인 안 된 건 '보도'·'추측'이라고
#   links: [{t: "노다지IR 3Q26 삼성전자", u: "https://contents.premium.naver.com/ystreet/irnote/contents/..."}] — 다른 곳 컨콜 정리 원문 링크
#          (원문을 통째로 옮기지 않고 링크만 · 내용은 우리 말로 짧게 요약에 반영)
#   short: 맨 아래 '핵심만' 몇 줄 (가장 압축한 요약)
#   body: 자세한 요약 (줄바꿈 그대로 보여줘요)
#   once: 🧾 일회성 점검 (꼭) {rep 발표 숫자, cons 예상, items [＋ 한 번만 있는 이익 / − 한 번만 있는 비용 (금액)], core 일회성 뺀 실질, say 한 줄 결론}
#         — 예상 상회·하회가 일회성 때문인지가 핵심. 금액을 못 찾으면 '못 찾음'으로 (만들지 않기), 맨 위 분기 카드 첫 칸에 보여요
#   past: true — 지난 분기 짧은 요약 (tone 확신|보수|조건부|애매|회피 · tone_why · easy 2~3줄 · money 돈 쓰는 방향 · links) · 화면에서 접혀 있음, 최근 5개만
#   trend: 🧭 컨퍼런스콜마다 바뀐 것 — 맨 위 분기에 {span, lines, tone [{q, v, why}] 6개, money ['주주환원: … → …']} (tools/earnings_task.md 3-3b)

