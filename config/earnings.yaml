      2. 부문성과
      — ESS 출하 +60%↑ (QoQ), 매출 비중 30% 초반
      — 자동차: 유럽 미드니켈 출하 +10%↑ · 소형: 원통형이 IT 파우치 감소를 메워 매출 비슷

      3. 가이던스
      — 4Q 매출 약 +10%, ESS 출하 약 +40% (QoQ) · 이익률은 둔화 예고

      2️⃣ 경영진 발표

      1. ESS 가 성장의 중심⭐️
      ① 빅테크 첫 직접 계약 · 수주잔고 160GWh
      ② 북미 생산능력 내년 말 70GWh

      2. 정책 변화
      ① 미국 중국계 소재 허용 40% → 35% 이하, 연비 규제 약 30% 완화
      ② 유럽 산업법 수정안 — 현지 생산 인정 범위가 EU 27개국으로

      3️⃣ CFO (이창실)

      1. 4분기 이익률 둔화⭐️
      ① 일회성 소멸 + 혼다 합작 ESS 초기 고정비
      ② "변수가 많아 구체적 전망이 쉽지 않다"

      2. 재무
      ① CapEx 크게 줄이는 중, 남는 현금은 빚 갚기 먼저
      ② 올해 본사 추가 차입 없음, 자산 유동화 병행

      4️⃣ Q&A 하이라이트

      1. 4분기·내년, 중국계 양극재 (iM증권)
      ① 국내 외 비중국 업체 여러 곳 확보
      ② 27년은 전 사업 매출 성장 (숫자 없음)

      2. ESS 수익성·북미 수주 (키움증권)⭐️
      ① 50GWh 램프업 마무리 단계, 28년 물량 대부분 확정
      ② 수요가 생산능력보다 커 중요한 프로젝트 위주로 받겠다

      3. 46시리즈·탭리스 2170 (UBS)
      ① 확보 물량(1Q26 콜 440GWh+, 자막엔 '40GWh 이상') 외 곧 추가 수주 기대
      ② BBU용 LFP 2170 27년 2Q, HEV용 애리조나 27년 말 양산

      4. 부채비율·유럽 대응 (DB증권)
      ① 추가 차입 없음 · 폴란드 공장은 감가상각 줄어 가격 경쟁력
