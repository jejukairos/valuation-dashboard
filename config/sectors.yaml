# 업종별 PER 역사 (12개월 선행 기준, 증권사 리포트·기사 조사 2026-10-26).
#   bear = 바닥(지하실) PER: 업종이 가장 싸게 거래됐던 수준
#   base = 보통 PER: 평소 받는 범위의 위쪽
#   bull = 최고 PER: 리레이팅됐을 때 받아 본 수준
# stocks.yaml 에서 종목에 sector: 의류 처럼 적으면
#   - Bear 적정주가 = 바닥 PER (성장률 PER · 이 종목 10년 최저 PER · 이 업종 바닥 중 가장 낮은 값)
#   - Base·Bull = 성장률 × 1.5 / × 2 이되, 이 업종의 보통·최고 PER 을 넘지 않게 (수출주 이익이 한 해 튈 때 보정)
#   - history = 화면에 보여 줄 역사 한 줄, rerating = 리레이팅 상태 (종목에 rerating 을 따로 적으면 그게 우선)
# fair_mode: sector 로 고른 종목은 이 배수를 그대로 적정주가에 써요.
# 숫자만 바꾸면 다음 갱신부터 적용돼요.

