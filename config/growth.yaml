#             gm: [..] %, opm: [..] % (회계 기준), adj_opm: [..] % (회사 조정), date, src, note}
#   adj_opm: 회사가 쓰는 '조정 영업이익률' {분기: %} (주식 보상 비용 등을 뺀 것 — 팔란티어처럼 회사가 이 숫자로 말할 때)
#   region : 지역별 매출 성장률 YoY {지역: {분기: %}} 6분기 · region_src 출처 (보도자료·10-Q 지역별 매출로 계산)
#   once   : 성장률·이익률을 한 번만 키우거나 줄인 일 한 줄 (관세 환급·벌금 등) — ⚠ 로 강조, 지나간 분기 일이면 지움
#   guide 에 op: [하단, 상단] (영업이익 금액)·affo 도 됨 · 숫자 가이던스가 없으면 {date, note} 만
