#   why    : 왜 그 칸인지 한 줄 (사실만 · 매수·매도 추천 말 금지)
#   guide  : 회사가 말한 다음 분기 가이던스 — 실적 발표 때마다 새로 (tools/earnings_task.md 3-11)
