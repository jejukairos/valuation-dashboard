      - t: "PBR 1배가 바닥? — 내년 기준 1배 = 삼성 약 17.3만 원 · 하이닉스 약 107만 원 (말한 18만·100만 원과 비슷), 다만 과거엔 1배 밑으로도 갔어요"
        d: "2026-10-31"
        code: ["005930", "000660"]
        charts:
          - t: 삼성전자 PBR 1배 가격 (= 그해 말 BPS) ÷ 지금 주가
            u: 지금=100
            q: ["26E", "27E", "28E"]
            tbl: true
            lines:
              - {n: 삼성전자, v: [49, 78, 110]}
            why: "FnGuide 컨센서스 BPS (10/31) 26E 109,026 → 27E 172,864 → 28E 243,392원 ÷ 10/30 종가 220,500원"
            note: "매일 바뀌는 값은 종목 상세 'PBR 적정주가' 표의 'PBR 1배 (= BPS)' 줄에 자동으로 나와요"
          - t: SK하이닉스 PBR 1배 가격 (= 그해 말 BPS) ÷ 지금 주가
            u: 지금=100
            q: ["26E", "27E", "28E"]
            tbl: true
            lines:
              - {n: SK하이닉스, v: [41, 77, 120]}
            why: "FnGuide 컨센서스 BPS (10/31) 26E 573,367 → 27E 1,071,269 → 28E 1,668,213원 ÷ 10/30 종가 1,391,000원"
            kid: "PBR 1배는 '회사를 다 팔아 빚 갚고 남는 돈'만큼의 값이에요. 메모리 회사가 돈을 엄청 벌어서 이 남는 돈이 1년에 60~90% 씩 늘고 있어요. 그래서 1배 가격도 해마다 올라가요(28년 추정치면 지금 주가보다 높음). 하지만 예전에 장사가 안 될 땐 1배보다 더 싸게 팔린 적도 있어요."
        lines:
          - "🗣 말한 것 (사용자 전달 방송): 내년 기준 PBR 1배가 바닥 — 하이닉스 약 100만 원(지금 약 150만 원), 삼성 약 18만 원"
          - "✅ 계산은 맞아요: 27E BPS 기준 1배 = 하이닉스 107.1만 원 (10/30 종가 139.1만 원보다 -23%) · 삼성 17.3만 원 (22.05만 원보다 -22%) · '지금 약 150만 원'은 10/30 종가(139.1만 원)보다 높은 숫자"
          - "⚠ 1배가 '절대 바닥'은 아니었어요 (12개월 선행 PBR 밴드, 우리 계산): 삼성은 2015~16·2024~25년에 1배 아래 (최저 0.85배 = 25년 5월 54,200원) · 하이닉스는 2016·2018~19·2022~23년에 1배 아래 (최저 0.77배 = 16년 5월) — 메모리 값이 내릴 땐 1배 밑으로 갔어요"
          - "📈 북밸류가 빨리 느는 건 맞아요: BPS 26E → 27E 삼성 +59% · 하이닉스 +87% — 같은 1배여도 1년 뒤 가격 하단이 올라가요. 단, 27E BPS 는 이익 추정이 맞아야 생기는 숫자라 메모리 값이 꺾여 추정이 내려가면 같이 내려가요 · 자사주 소각·큰 배당도 BPS 증가를 줄여요"
          - "💰 배당 계산: 14,000원 ÷ 20만 원 = 7.0% 맞아요 · 10/30 종가 22.05만 원이면 6.3% · 국고채 10년 4.01%·3년 3.72% (10/30)보다 높음. 단, 컨센서스 주당 배당은 26E 9,380원 · 27E 7,401원 → 14,000원은 컨센서스의 약 2배 (27E EPS 72,460원의 약 19%) — 1월 이사회로 확인할 것"
          - "🏦 삼성 남은 주주환원: 8/21 이사회 '올해 남은 재원 90~110조' → 3분기 현금배당 약 30조 → 나머지(약 60~80조, 방송의 '약 75조')는 27년 1월 이사회에서 배당·자사주 방식과 규모 결정 · 임직원 보상 자사주 약 15조는 별도 — 그래서 3Q26 콜엔 새 숫자가 없었어요"
          - "💵 SK하이닉스 3Q26: 주당 배당 20,000원 (정기 10,000 + 특별 10,000 = 키옥시아 투자 이익) · 26년 현금배당 30조+ · 자사주 매입·소각 60조+ · 잉여현금흐름 50% 이상 환원 · 분기마다 자사주 매입 계속"
          - "🧮 이익 추정 비교 (개인 추정 vs 컨센서스 10/31): 삼성 4Q26 약 125조 vs 약 129조 (26E 382.8조 − 1~3Q 254.1조) · 27년 500~550조 vs 599조 · 하이닉스 4Q26 약 105조 vs 약 100조 (281.2조 − 181.5조) · 27년 400조대 vs 451조 → 삼성은 개인 추정이 컨센서스보다 낮고(보수적), 하이닉스 4Q 는 조금 높음"
          - "🗣 (11/3 전달 글) 하이닉스 내년 BPS 약 98만 원 → PBR 0.9배 90만 · 2배 200만 → '110만 원이면 아래 20만 vs 위 90만' (약 1 : 4.5) · 삼성 최악 저점 19만 원"
          - "✅ 우리 계산: 하이닉스 27E BPS 컨센서스 107.1만 원 (글의 98만보다 +9%) → 0.9배 96.4만 · 2배 214.3만 · 110만 원 = 27E 1.03배 (10년 PBR 밴드 하단 1.02배와 거의 같음) · 28E 0.66배 · 11/2 종가 148만 원보다 -26% (이번 하락 주봉 바닥 10/23 126.3만 원)"
          - "✅ 삼성 19만 원 = 27E PBR 1.10배 (10년 밴드 하단 1.09배와 거의 같음) · 28E 0.78배 · 10/15 저점 21만보다 -9.5% · 6/18 고점 36.25만 대비 -47.6% (7/30 바닥 -42.9% 보다 깊음 → 보유 카드 📜 -40% 패턴 칸과 같이 보기)"
          - "🗣 하이닉스 반등 170~190만 원 = 27E 1.59~1.77배 (10년 밴드 평균 1.59배부터) · 28E 1.02~1.14배 — 글쓴이는 박스권으로 보고, 오르면 줄이고 28년 증설 물량 탓에 실적 쇼크가 날 때 다시 크게 담는다는 구상 (글쓴이 생각 · 우리 추천 아님)"
          - "🗣 (11/3 방송) 락바텀(가장 깊은 바닥) = 하이닉스 내년 BPS 100만 × 0.9배 = 90만 원 · 삼성 내년 말 BPS 17만 × 1.1배 ≈ 18.7만 원 → 보유자는 손절보다 3년 보유를 말함 (개인 판단 · 우리 추천 아님)"
          - "✅ 우리 계산 (컨센서스 27E BPS): 하이닉스 0.9배 96.4만 원 (11/2 148만보다 -35%) · 삼성 1.1배 19.0만 원 (23만보다 -17%) = 위 전달 글 '삼성 19만' 과 같은 자리 · 방송의 18.7만 = 28E 0.77배"
          - "🗣 다시 사는 시점 (방송): 내년 5~10월, 어닝쇼크 · 목표가 하향 · 모건스탠리 부정 코멘트로 분위기가 바닥일 때 — 그 전엔 현금이나 코스피200·코스닥150 지수로 20~30% 회복 수익 (개인 판단)"
          - "👥 '외국인이 하이닉스 120만~90만 · 삼성 21만 부근에서 살 것' (방송 추정, 근거 없음) → 우리 데이터 (KRX 투자자별, 최근 1년): 외국인은 모든 가격대에서 순매도 (하이닉스 -98.9조 · 삼성 -88.6조 원) · 순매수한 날만의 평균 가격 하이닉스 약 120만 · 삼성 약 19.9만 · 최근 20거래일도 순매도 (하이닉스 -10.4조 · 삼성 -3.5조) → 아직 '매집' 신호는 없음 (종목 상세 👥 칸)"
        turn:
          - "메모리 값·27E 이익 추정이 꺾이는지 — 내려가면 '1배 가격'도 같이 내려가요 (🔎 추정치 방향 칸)"
          - "삼성 1월 이사회: 남은 환원 중 현금배당이 주당 얼마인지"
          - "28년 증설 물량: 삼성 P5 (D램 카파 그림상 28년 말부터) 등 새 공장이 돌면서 28E 이익 추정이 꺾이기 시작하는지 (11/3 전달 글이 '실적 쇼크' 로 본 시점) — LTA 로 27·28년 생산 절반 이상을 미리 판 게 완충 (LTA 카드)"
          - "분위기 바닥 신호 3가지 (11/3 방송이 본 다시 사는 조건, 내년 5~10월로 봄): 어닝쇼크 · 목표가 하향 (🔎 추정치 방향 칸) · 모건스탠리 부정 코멘트"
