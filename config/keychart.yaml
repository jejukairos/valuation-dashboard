    META: "광고 회사라 손님·광고가 늘어도 더 드는 원가가 거의 없는 고정비형이에요 (큰 비용은 개발자 월급·데이터센터). AI 데이터센터 투자가 아주 커서 앞으로 감가상각이 해마다 크게 늘어요 — 광고 매출이 그보다 빨리 늘어야 이익률이 유지돼요."
    GOOG: "검색·유튜브는 고정비형(개발자·데이터센터)이에요. 매출원가 안의 검색 제휴 수수료(애플 등에 주는 돈, TAC)는 광고 매출 따라 느는 변동비예요. 클라우드·AI 데이터센터 투자가 커서 감가상각이 빠르게 늘고 있어요."
    MSFT: "오피스 같은 소프트웨어는 한 번 만들면 더 파는 데 드는 돈이 거의 없는 고정비형이에요. 애저(클라우드)는 데이터센터 감가상각이라는 고정비가 빠르게 늘고 있어서, AI 매출이 그만큼 따라오느냐가 이익률을 정해요."
    NVDA: "공장이 없어요. 칩은 TSMC가 만들고 HBM은 SK하이닉스 등에서 사 와요 → 매출원가는 변동비. 고정비는 연구개발·월급 정도라 매출이 크게 늘면서 이익률이 크게 올랐어요. 메모리처럼 값이 내린다고 바로 적자가 나는 구조는 아니지만, 맡기는 값(웨이퍼·HBM·패키징)이 오르면 매출총이익률이 깎여요."
    TSLA: "기가팩토리 공장 고정비가 커서 판매 대수가 줄면 이익률이 빠르게 떨어져요 (24~25년). 부품·배터리값은 변동비예요. 로봇택시·AI 학습용 설비 투자로 고정비가 더 늘고 있어요."
    AMZN: "두 가지가 섞여 있어요. 쇼핑은 상품값·배송비(변동비)가 커서 이익률이 얇고, AWS(클라우드)는 데이터센터 고정비형이라 영업이익의 큰 몫이 여기서 나와요. AI 데이터센터 투자가 커서 감가상각이 빠르게 늘고 있어요."
