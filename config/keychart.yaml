ipo:  # 🆕 상장 준비 중인 관심 회사 → ⭐🇺🇸 관심 탭 (사용자 11/3: "앤트로픽도 이제 관심종목에 넣자")
  - name: 앤트로픽
    id: anthropic
    t: "앤트로픽 3분기 실적 (수정 상장 서류 S-1/A, 11/2) — 매출 1년 새 12배, 그런데 성장 둔화·다시 적자"
    d: "2026-11-03"
    top:
      - "🟡 성장 둔화: 분기 매출 169.6억$ — 지난 분기 대비 +144% → +47% 로 꺾임 (1년 전보다는 아직 +1,127%, 약 12배)"
      - "🟡 다시 적자: 영업이익 +9.7억$ (2분기, 첫 흑자) → −5.7억$ — 급하게 빌린 컴퓨터 값이 비쌌고(보도: 약 50억$), 가격을 내려 매출이 약 6억$ 줄었고, 기부 매칭 비용 약 20억$ (현금은 안 나감)"
      - "🟢 컴퓨팅 계약은 계속 급증: 앞으로 사기로 약속한 금액 약 8,954억$ — 이번 분기 매출의 약 53배 (약 2/3 는 해지 못 하는 조항, 그림)"
      - "🧾 회사 기준 조정 영업이익(주식 보상·기부 매칭 뺀 값)은 흑자 24.6억$ — 하지만 이익률은 19% → 15% 로 내려감"
    charts:
      - t: 분기 매출 & 1년 전 대비 성장률
        u: 억$
        d: 1
        tbl: true
        q: [25.2Q, 25.3Q, 25.4Q, 26.1Q, 26.2Q, 26.3Q]
        bars:
          - {n: 분기 매출, v: [7.87, 13.82, 20.40, 47.31, 115.55, 169.56]}
        pct: {n: 1년 전 대비 성장률, v: [null, null, 936, 1158, 1368, 1127]}
        why: "회사 서류(S-1·S-1/A) 숫자 · 26.1Q+26.2Q = 상반기 162.9억$ (원래 S-1 보도와 같음 ✅) · 26.3Q 169.56억$ (여러 보도 같음 ✅)"
        kid: "앤트로픽은 '클로드'라는 AI 를 만드는 회사예요. 1년 사이 분기 매출이 12배가 됐어요. 그런데 1년 전 대비 성장률이 1,368% → 1,127% 로 처음 내려왔어요 — 여전히 엄청 빠르지만 '크는 속도'가 조금 느려졌어요."
      - t: 분기 영업이익 (억$)
        kind: line
        u: 억$
        q: [25.2Q, 25.3Q, 25.4Q, 26.1Q, 26.2Q, 26.3Q]
        lines:
          - {n: 영업이익, v: [-12.0, -30.89, -28.36, -16.67, 9.74, -5.67]}
        why: "0 아래 = 적자 · 26.1Q+26.2Q = 상반기 영업손실 6.93억$ (원래 S-1 보도와 같음 ✅) · 26.3Q 영업비용 175억$ (2분기 106억$)"
        kid: "2분기에 처음으로 장사해서 남겼는데(흑자), 3분기엔 다시 조금 모자랐어요(적자). 손님이 갑자기 늘어 컴퓨터를 비싸게 급히 빌렸고, 값도 깎아 줬기 때문이에요."
      - t: 분기 순손실 (억$)
        kind: line
        u: 억$
        q: [25.3Q, 25.4Q, 26.1Q, 26.2Q, 26.3Q]
        lines:
          - {n: 순이익(손실), v: [-121.4, -168.9, -144.4, -663.1, -232.9]}
        why: "연합뉴스 그림 (11/3, 자료 SEC) · 26.1Q+26.2Q = 807.5억$ (원래 S-1 보도 상반기 순손실 807억$ ✅) · 매출·영업이익도 그림과 우리 숫자가 같음 ✅"
        kid: "순손실이 영업손실보다 훨씬 커요. 대부분은 투자받을 때 낸 채권(전환사채 등)의 값을 다시 매기며 장부에 적은 손실이라 실제로 현금이 나간 건 아니에요 (3분기 233억$ 중 약 219억$). 회사 가치가 오를수록 이 장부상 손실이 커져요."
      - t: 분기 매출 성장률 (지난 분기 대비, QoQ)
        kind: line
        u: "%"
        q: [25.1Q, 25.2Q, 25.3Q, 25.4Q, 26.1Q, 26.2Q, 26.3Q]
        lines:
          - {n: 지난 분기 대비, v: [91, 109, 76, 48, 132, 144, 47]}
        why: "우리 계산 = 분기 매출 ÷ 지난 분기 매출 (그림과 같음 ✅) · 25.4Q +48% 때도 다음 분기에 +132% 로 다시 빨라졌어요"
      - t: 컴퓨팅 계약 상대별 비중 (추정)
        u: "%"
        d: 1
        q: [브로드컴, 스페이스X, 구글, 아마존, MS, 그 밖]
        bars:
          - {n: 비중, v: [25.0, 18.8, 18.7, 17.1, 7.0, 13.4]}
        why: "사용자 전달 그림 (S-1 기준 추정치 — 그림에도 '정확하지 않을 수 있음') · 회사는 상대별 금액을 따로 안 밝힘 · '그 밖' = 100 − 나머지 합 (우리 계산)"
        kid: "앤트로픽이 AI 를 돌릴 컴퓨터를 누구에게서 빌리기로 했는지예요. 브로드컴(칩)·스페이스X·구글·아마존이 비슷하게 큰 몫이에요."
    lines:
      - "📅 상장 준비: 10/26 S-1 → 11/2 수정 S-1/A (3분기 숫자 추가) · 나스닥 'ANT' 예정 (보도) · 공모가·주식 수는 아직 빈칸"
      - "📈 이번 분기 매출 × 4 = 연 약 678억$ 규모"
