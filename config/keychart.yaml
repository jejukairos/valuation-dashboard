# 🔑 키팩터 · 키차트 — 주가를 움직이는 핵심 숫자와 '변곡점'에서 볼 것 (산업 탭 + 종목 상세)
#   industry: {업종 이름: 묶음} → 산업 탭 '🔑 키팩터 · 키차트' + stocks.yaml industry 에 그 이름이 든 종목 상세 (방산 → 한화에어로·현대로템·LIG·KAI)
#   stock: {종목 코드: 묶음} → 그 종목 상세에만
#   묶음: key 키팩터 한 줄, turn [변곡점 체크], cards [카드], codes [업종 이름과 상관없이 이 묶음을 보여줄 종목] (예: AI 자금줄)
#   카드: t 제목, d 날짜, code 주인공 종목(그 종목 상세에서만 펼침 · 여러 개면 ["005930", "000660"]), charts [그림], wf [이익 변동 요인], lines [핵심 줄], turn [이 카드의 변곡점 체크], track 주가 비교, src 출처, u [{t, u}] 링크
#     그림: t, u 단위(억원 → 1조 넘으면 조원으로 보여줌), q [분기], bars [{n, v}] 쌓은 막대, lines [{n, v}] 같은 단위 선, pct {n, v} 위쪽 % 선, why, note
#           tbl: true → 그림 위에 모든 칸 숫자 표 · kid: 그림 아래 🐣 초등학생 설명
#     wf: t, from [이름, 값], to [이름, 값], steps [[요인, 값]] (값은 억원, 대략)
#     track: {code, d 기준일, p 기준 가격, n 기준 이름, then 예전 같은 일의 주가 흐름} → 기준일 대비 지금·저점을 자동 계산
#   증권사 차트 그림은 올리지 않고(저작권) 숫자로 다시 그려요. 회사 IR 숫자가 먼저, 증권사 그림에서 눈으로 읽은 값은 '대략'이라고 적기
#   매수·매도 추천 문구 금지 (증권사 판단은 그 증권사 판단으로만)
#   acct: ⚠ 회계 기준이 바뀐 종목 메모 (예: 에이피알 IFRS 18 조기 적용) — 이익률을 1년 전·다른 회사와 맞댈 때 기준을 맞추라고
#   cost: ⚖️ 고정비 vs 변동비 → 산업 탭 표 + 종목 상세 '💸 얼마 벌어서 어디에 썼나' 아래 한 칸
#     ind [{n 업종, k [stocks.yaml industry 에 든 글자], codes [업종 글자와 상관없이 이 줄로 묶을 종목], lv 1 변동비~5 고정비, t, big 큰 비용, so 그래서·볼 것}]
#     stock {코드: 이 종목만의 한 줄} · 재무제표 비율(최근 4분기 매출원가·영업비용·연구개발·설비투자)은 화면이 자동 계산
#   ipo: 🆕 상장 준비 중인 관심 회사 (아직 주가 없음) → ⭐🇺🇸 관심 탭 위. 카드 모양 + name, top [맨 위 핵심 3~4줄] · 그림 kind: line → 0 아래(적자)도 그리는 꺾은선
#     상장해서 주가가 생기면 stocks.yaml watchlist 로 옮기고 여기서 지운다 (tools/earnings_task.md 3-12)
