      - t: "장기공급계약(LTA) — 몇 년치를 미리 팔아 뒀나: 하이닉스 27·28년 생산의 50%+ · 삼성 2030년 60~70% 목표 · 마이크론 2030년까지 매출 35%+"
        d: "2026-10-31"
        code: ["005930", "005935", "000660", "MU"]
        charts:
          - t: LTA 비중 (회사가 말한 숫자의 아래쪽)
            u: '%'
            q: ["하이닉스 27·28", "삼성 ~2030", "마이크론 ~2030"]
            tbl: true
            bars:
