      - "🏦 현금·단기투자·쓸 수 있는 대출 한도 합계 약 1,466억$"
      - "🔗 우리 종목과 연결: 구글·아마존·MS 수주잔고 안의 앤트로픽 약속 2,000·1,000·300억$ (산업 탭 AI 자금줄 '누가 사 주나' 카드) · 아마존은 1년 전 3분기 앤트로픽 평가이익 95억$ 가 순이익에 있었음"
    turn:
      - "다음 분기(4Q26) 지난 분기 대비 성장률이 다시 빨라지는지(25.4Q +48% → 26.1Q +132% 처럼), 더 느려지는지"
      - "가격 인하가 계속되는지 — 이번 분기 가격 인하·할인으로 매출 약 6억$ (2분기 매출의 약 5%)"
      - "급히 빌린 비싼 컴퓨터 값이 장기 계약 장비가 들어오며 줄어드는지 (브로드컴 장비는 27년부터 들어옴, 보도)"
      - "상장 공모가·규모가 깎이는지 · 상장 뒤 신용등급 (투기등급 BB 대 전망, FT) — 산업 탭 AI 자금줄 변곡점과 같이"
