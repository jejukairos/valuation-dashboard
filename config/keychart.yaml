    "005930": &sec "두 가지가 섞여 있어요. 메모리·파운드리 공장은 고정비가 아주 크고, 스마트폰·TV·가전(DX)은 부품을 사서 조립해 변동비가 커요. 메모리 값이 오를 땐 고정비 덕에 이익이 크게 늘고, 내리면 크게 줄어요. 파운드리는 공장을 덜 채우면 고정비 때문에 적자가 나요."
