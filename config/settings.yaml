# 판정 기준값. 숫자만 바꾸면 다음 갱신부터 적용돼요.

# 1. 금리 vs 주식 신호등 (비율 = 주식 선행 PER ÷ 채권 환산 PER)
bond_signal:
  green_max: 0.50   # 이 값 이하 → 🟢 매력
  yellow_max: 0.75  # 이 값 이하 → 🟡 중립, 넘으면 🔴 위험
  stock_alert_above: 1.0  # 종목 카드: 선행 PER ÷ 채권 환산 PER 이 이 값 이상일 때만 "금리 대비 비쌈" 표시

# 2. 종목 판정
stock_signal:
  cheap_gap: -0.20      # 현재가가 적정가보다 20% 이상 낮으면 🟢
  expensive_gap: 0.10   # 현재가가 적정가보다 10% 이상 높으면 🔴
  band_low: 20          # 10년 밴드 하위 20% 이하 → 🟢
  band_high: 80         # 10년 밴드 상위 20% 이상 → 🔴

# 카드의 "적정가" 계산법
fair_value:
  eps_year: auto        # auto = 올해 추정치 (밴드 배수가 '올해 실적' 기준이라 현재가와 같은 시점끼리 비교). 26E / 27E 처럼 고정도 가능
  multiple: avg10       # avg5 / avg10 / low10 / high10 (5년·10년 평균, 10년 하단·상단)

# 시장 국면: 성장률 PER 을 얼마나 줄지
#   긴축·약세(tight): 적정가 = 성장률 × 1 (Bear 칸), 상방은 × 1.5 (Base 칸) 까지
#   완화·강세(easy):  적정가 = 성장률 × 1.5 (Base 칸), 상방은 × 2 (Bull 칸) 까지 — 금리 인하로 돈이 많이 풀릴 때
market_regime:
  mode: auto          # auto = 아래 기준으로 자동, tight / easy 로 직접 고정도 가능
  us10y_tight: 5.0    # 미국채 10년이 이 % 이상이면 긴축 구간
  ma_days: 200        # 지수(한국 = 코스피, 미국 = S&P500)가 이 일수 평균 아래거나, 평균선이 한 달 전보다 낮으면 약세·횡보

# 밴드 하단·상단의 정의 (백분위). 10 → 하위 10%, 90 → 상위 10%
band:
  low_pct: 10
  high_pct: 90
  per_cap: 100          # 이익이 거의 없던 시기의 PER(100배 초과)은 평균·상단·하단 계산에서 뺌
  per_basis: forward    # PER 밴드 기준: forward = 1년 뒤 실적 기준(증권사 12개월 선행 PER 밴드와 비슷), trailing = 지난 실적
                        # 종목별로 바꾸려면 stocks.yaml 에 per_basis: trailing

# PBR 종목: 요구수익률 = 국고채 3년 + 이 값(%p)
pbr:
  risk_premium: 5.0

# 배당 이력이 짧은 종목(배당을 막 시작)의 배당 적정가 계산에 쓸 목표 배당수익률(%)
dividend:
  target_yields: [6, 5, 4, 3]

# 리레이팅 경고: 현재 PER 이 10년 밴드 이 위치(%) 이상인데
# 28E EPS 가 최근 실적 대비 이만큼(%) 이상 늘지 않으면 ⚠
rerating:
  band_pos: 85
  eps_growth: 20

# 한국 시장 선행 PER: 코스피 시가총액 상위 몇 개 종목으로 계산할지
kospi_forward:
  top_n: 150   # 50개면 대형주 쏠림으로 PER 이 약 7% 낮게 나와서 150개로 (우산 자료와 1% 이내 일치)

# 코스피 PBR 내 기준선 (밴드 차트에 선으로 표시하고, 그 PBR 이 되는 지수를 계산해 보여줌)
kospi_pbr_marks:
  - {value: 0.8, label: "역사적 바닥권 (공포 때마다 '무조건 사는 구간'으로 회자)"}
  - {value: 0.9, label: "기회 구간"}
  - {value: 1.0, label: "PBR 1배"}

# 코스피 12개월 선행 밴드 차트의 배수 선 (키움·FnGuide 차트와 같은 방식)
kospi_bands:
  per: [5, 6, 7, 8]
  pbr: [0.7, 0.8, 0.9, 1.0, 1.1]

# 코스피 바닥 관련 증권사 코멘트 메모 (화면 코스피 카드에 그대로 보여줌, 직접 추가해도 돼요)
kospi_notes:
  - {date: "2026-10-16", source: "키움 한지영", text: "워스트 시나리오 시 이익 신뢰성이 약해 선행 PER 보다 선행 PBR 로 바닥을 잡는 게 합리적. 선행 PBR 1.0배 = 5,100pt 선을 저점권으로 설정"}
  - {date: "2026-10-16", source: "키움 (FnGuide)", text: "10/15 선행 PER 4.24배로 2001년 이후 최저, 역사적 밴드 하단을 크게 이탈 → 선행 PER 로는 바닥 잡기 어려움. 10/15 선행 PBR 1.07배"}

# 지수 적정 수준 시나리오 표에 쓸 배수 (EPS × PER, BPS × PBR)
index_scenarios:
  kospi_per: [8, 9, 10, 11, 12]
  kospi_pbr: [0.8, 0.9, 1.0, 1.1, 1.2, 1.4]
  sp500_per: [16, 18, 20, 22]

# 크롤링 요청 사이 대기(초)
request_delay: 1.0
