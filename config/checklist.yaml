# 점수 체크리스트에서 숫자로 자동 계산할 수 없는 항목 (0~10점).
# 비워 두면 그 항목은 빼고 계산해요 (총점은 '점수가 있는 항목' 기준 100점 환산).
# 종목 코드 아래에 적어요. 예:
#
# "005930":
#   rank: 9          # 산업에서 1위(또는 1위가 될) 기업인가
#   moat: 8          # 독점적인 제품·서비스가 있는가
#   growth: 8        # 향후 몇 년간 매출이 늘 잠재력
#   market: 9        # 산업 시장 규모가 커지는가
#   competition: 6   # 경쟁 강도 (치열할수록 낮게)
#   sales_scale: 9   # 매출 규모가 동종 업계 대비 좋은가
#   memo: "HBM 경쟁 심화"
