# 🏁 업종 시총 순위 (사용자 11/27, BRILLER '화장품 시총 변화' 글 + 구릴라님 관점): 업종 안 1등이 바뀌거나, 밑에 있던 회사가 치고 올라오면 신호 · 시총이 빠지는 회사는 위험 신호
# collector/sector_rank.py 가 네이버 증권 업종(WICS 와 같은 이름) 종목·시총을 받아 이 묶음대로 순위를 매김 → site/data/sector_rank.json
#   up: 네이버 업종 이름 (그 업종 종목 전부) · add: 다른 업종에 있는데 같이 볼 종목 · drop: 뺄 종목 (지주사·이미 다른 묶음)
#   ind: 산업 탭 업종 칸 이름에 이 글자가 들어가면 그 칸 맨 위에 표 · top: 표·신호를 보는 순위 (기본 15)
#   우선주(이름 끝 '우'·'우B')·리츠는 자동으로 뺌 · 새 묶음은 한 줄 추가하면 다음 차트 스캔(평일 06:40·16:10) 때 생겨요
min_cap: 1000   # 억원 — 이보다 작은 회사는 표에서 뺌 (사용자 "1,000억 이상")
sectors:
  - {n: 화장품, ind: 화장품, up: [화장품], add: ["257720", "086450", "340570", "251970"]}   # 실리콘투(인터넷소매)·동국제약(제약)·티앤엘·펌텍코리아(포장재) = BRILLER 표에 있음
  - {n: 방산·우주, ind: 방산, up: [우주항공과국방]}
  - {n: 반도체 소부장, ind: 반도체, up: [반도체와반도체장비], drop: ["005930", "000660", "402340"], top: 20}   # 삼성전자·SK하이닉스·SK스퀘어(지주) 빼고 장비·소재·부품·설계
  - {n: 2차전지, ind: 2차전지, up: [전기제품], add: ["086520", "003670"]}   # 에코프로·포스코퓨처엠 (화학 업종에 있음)
  - {n: 전력기기, ind: 전력기기, up: [전기장비]}
  - {n: 기판·전자부품, ind: 기판, up: [전자장비와기기]}
  - {n: 자동차·부품, ind: 자동차, up: [자동차, 자동차부품]}
  - {n: 조선, up: [조선]}
  - {n: 음식료, ind: 음식료, up: [식품, 음료, 담배]}
  - {n: 엔터, ind: 엔터, up: [방송과엔터테인먼트]}
  - {n: 백화점·유통, ind: 백화점, up: [백화점과일반상점, 인터넷과카탈로그소매], drop: ["257720"]}
  - {n: 의료기기·미용, up: [건강관리장비와용품, 건강관리기술], drop: ["340570"]}
  - {n: 제약·바이오, up: [제약, 생물공학, 생명과학도구및서비스], drop: ["086450"], top: 20}
  - {n: 통신, up: [무선통신서비스, 다각화된통신서비스, 통신장비]}
  - {n: 게임, up: [게임엔터테인먼트]}
  - {n: 인터넷·IT서비스, up: [양방향미디어와서비스, IT서비스, 소프트웨어]}
  - {n: 로봇·기계, ind: 로봇, up: [기계]}
  - {n: 화학, up: [화학], drop: ["086520", "003670"]}
  - {n: 철강·비철, up: [철강, 비철금속]}
  - {n: 건설·건자재, up: [건설, 건축자재]}
  - {n: 의류, up: ["섬유,의류,신발,호화품"]}
  - {n: 여행·카지노·항공, up: ["호텔,레스토랑,레저", 항공사]}
  - {n: 증권, up: [증권]}
  - {n: 은행·보험, up: [은행, 생명보험, 손해보험]}
