# 적정주가 칸 메모 — 증권사 리포트·의견을 손으로 적어 두는 곳 (종목 카드에 보여요)
#   y2: 📅 28E 기준 칸(접혀 있는 칸) 안에 보여요.
#       pbr: [1.0, 1.5, 3.0] 처럼 적으면 우리 28E BPS × 그 배수 가격과 지금 대비 %도 같이 계산해서 보여 줘요 (per 도 같은 방식).
#   memo: 적정주가 칸 아래 '🗒 증권사 메모'(접혀 있음)에 보여요.
#   증권사마다 쓰는 BPS·EPS 추정치가 우리 컨센서스와 달라서, 같은 배수라도 가격이 다를 수 있어요.
"071970":
  memo:
    - date: "2026-10-29"
      src: DS투자증권
      text: "3분기 영업이익 603억원, 시장 기대치 44% 상회 (2분기 이연 물량 + 4분기 예정 물량 일부 선반영). 2026년 1~3분기 신규 수주 약 7,800억원 — 중국향 약 5,800억원(74%), 작년 연간보다 약 39% 많음. 글로벌 선박 발주 증가·그룹사 LPGC향 엔진 수주 확대로 27년에도 엔진 가동률 100~110% 전망, 26년 고가 수주 물량이 27년부터 매출에 반영. 그룹사 발전용 엔진 양산 확대로 터보차저 공급도 늘 전망. 영업이익 전망 26년 1,780억 · 27년 2,380억 · 28년 3,020억원"
"000660":
  y2:
    - date: "2026-10-29"
      src: UBS증권
      text: "투자의견 매수, 목표주가 300만원 (PBR 3.62배). 3분기 DRAM ASP 전분기 대비 +27% (기대 이상). 4분기 영업이익 추정 100조 → 112조원 (컨센서스 91조). 지금 주가는 28E PBR 1.5배 = 반도체 가격 30% 하락(LTA 미이행 또는 LTA 기준가격 50% 하락)을 미리 반영한 수준. 28E PBR 1배면 -27%, 3배면 +155%"
      pbr: [1.0, 1.5, 3.0]
