NVDA:
  code: NVDA
  name_ko: 엔비디아
  checked_at: '2026-10-25'
  one_liner: AI를 학습·실행시키는 데이터센터용 GPU와 네트워크 장비를 팔아 돈을 벌어요. 빅테크와 AI 회사들이 데이터센터를 계속 늘리면서 매출의 약 90%가 데이터센터에서 나와요.
  oligopoly:
    growth: 성장 중이에요. FY2026(2026년 1월 끝) 매출 2,159억 달러로 1년 새 65% 늘었고, 최근 분기(2026년 7월 끝)는 962억 달러로 1년 전보다 106% 늘었어요.
    share: IoT Analytics 추정으로 2024년 데이터센터 GPU 시장의 92%를 차지했어요(AMD 4%, 화웨이 2%).
    barriers: 칩뿐 아니라 CUDA 소프트웨어, 서버 간 연결(네트워킹)까지 한 묶음으로 팔아서, 개발자와 고객이 다른 회사로 옮기기 어려워요.
    verdict: O
  pick_and_shovel:
    verdict: O
    why: 오픈AI·구글·메타 중 누가 AI 경쟁에서 이기든 모두 엔비디아 칩을 사야 해요. 다만 매출의 22%, 14%가 각각 직접 고객 한 곳에서 나와 소수 고객에 쏠려 있어요.
  pricing_power:
    verdict: O
    why: 매출총이익률이 FY2026 71.1%에서 최근 분기 75.0%로 올라, 비싸게 팔아도 수요가 따라오고 있어요. 구체적인 가격 인상 발표 사례는 확인하지 못했어요.
  data_company:
    verdict: X
    why: AI를 돌리는 장비를 파는 회사예요. 사용자 데이터를 직접 모아 서비스하는 구글·오픈AI와는 달라요.
  wallet:
    verdict: X
    why: 돈은 주로 기업이 칩을 한 번에 사는 방식으로 벌어요. 클라우드 게임 구독(GeForce NOW)이 있지만 매출 비중은 아주 작아요.
  human_indicator: 2026년 10월 하순, 'AI 투자가 정점을 찍은 것 아니냐'는 걱정과 엔비디아가 고객(네오클라우드)에 돈을 대주는 구조에 대한 의문이 커져 투자자들이 조심스러운 분위기예요. (Investing Live, 2026-10-21 기사 기준)
