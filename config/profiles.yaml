GOOG:
  code: GOOG
  name_ko: 알파벳
  checked_at: '2026-10-25'
  one_liner: 구글 검색과 유튜브 광고로 큰돈을 벌고, AI(제미나이)와 클라우드가 새 성장 엔진입니다. 2026년 2분기 클라우드 매출이 1년 새 82% 늘었습니다.
  oligopoly:
    growth: 성장 중입니다. 2025년 매출 4,028억 달러로 15% 늘었고, 2026년 2분기는 1,198억 달러로 24% 늘었습니다.
    share: 전 세계 검색엔진 점유율 약 90%(StatCounter, 2026년 9월)로 사실상 독점입니다. 클라우드는 15%로 3위입니다(Synergy, 2026년 2분기).
    barriers: 수십억 명의 검색·유튜브 데이터, 안드로이드·크롬이라는 통로, 자체 AI 칩(TPU)과 데이터센터가 있어서 따라잡기 매우 어렵습니다.
    verdict: O
  pick_and_shovel:
    verdict: △
    why: 구글 클라우드는 다른 AI 회사들에게 컴퓨터 자원(TPU·GPU)을 빌려줘서 누가 이기든 돈을 법니다. 하지만 매출 대부분인 광고는 구글이 직접 경쟁에서 이겨야 하는 사업입니다.
  pricing_power:
    verdict: O
    why: 2026년 4월 미국 유튜브 프리미엄 가격을 월 13.99달러에서 15.99달러로, 가족 요금을 22.99달러에서 26.99달러로 올렸습니다. 광고주도 검색 광고를 대체할 곳이 마땅치 않습니다.
  data_company:
    verdict: O
    why: 검색, 유튜브, 지도, 지메일, 안드로이드에서 매일 엄청난 사용자 데이터를 모으고, 이걸로 광고와 AI를 더 똑똑하게 만듭니다.
  wallet:
    verdict: O
    why: 유튜브 프리미엄, 구글 원(저장공간), 유튜브 TV 등 유료 구독이 3억 2,500만 건이 넘습니다(2025년 4분기 기준). 기업들은 클라우드 요금을 매달 냅니다.
  human_indicator: 1년 새 주가가 크게 올라 'AI 승자'라는 기대가 큽니다. 동시에 2026년 설비투자 계획(1,750억~1,850억 달러)이 너무 크다는 걱정도 있어서, 발표 직후 주가가 한때 5% 떨어지기도 했습니다.
