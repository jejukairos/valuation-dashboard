META:
  code: META
  name_ko: 메타
  checked_at: '2026-10-25'
  one_liner: 페이스북·인스타그램·왓츠앱을 매일 36억 명이 쓰고, 그 사람들에게 보여주는 광고로 매출의 98%를 번다. AI로 광고를 더 정확하게 맞히면서 광고 단가와 매출이 계속 오르고 있다.
  oligopoly:
    growth: 성장 중. 매출이 2024년 1,645억 달러에서 2025년 2,010억 달러로 22% 늘었고, 2026년 3분기에도 작년보다 26% 늘었다.
    share: eMarketer 추정으로 2026년 전 세계 디지털 광고의 약 26.8%를 가져가 구글(26.4%)을 제치고 1위가 될 전망이다. 하루 이용자는 36억 4천만 명(2026년 9월)이다.
    barriers: 36억 명이 이미 모여 있어 친구가 있는 곳을 떠나기 어렵고(네트워크 효과), 쌓인 이용 데이터와 1년에 1,350~1,450억 달러를 쏟는 AI 설비 투자는 새 경쟁자가 따라 하기 힘들다.
    verdict: O
  pick_and_shovel:
    verdict: △
    why: 어느 쇼핑몰·게임·앱이 이기든 손님을 모으려면 메타에 광고를 내야 해서 '광고판' 역할은 한다. 다만 AI 경쟁에서는 칩을 사서 직접 싸우는 쪽이라 청바지 회사와는 다르다.
  pricing_power:
    verdict: O
    why: 2025년 광고 1건당 평균 가격이 9% 올랐는데도 광고 노출은 12% 늘었다. 2026년 3분기에도 광고 단가가 14% 올랐고 노출도 10% 늘어 광고주가 떠나지 않았다.
  data_company:
    verdict: O
    why: 36억 명이 무엇을 보고 누르고 사는지 매일 데이터가 쌓이고, 이 데이터로 광고를 누구에게 보여줄지 정한다.
  wallet:
    verdict: X
    why: 앱은 대부분 공짜이고 돈은 광고주가 낸다. 유료 인증(메타 버리파이드)·VR 기기 같은 소비자 매출은 전체의 약 2.4%뿐이다.
  human_indicator: 8월 중순까지는 AI 투자비 걱정으로 주가가 연초보다 약 18% 빠졌다가, 9월 AI 비서 '뮤즈' 출시 후 한 달에 약 36% 올라 2013년 이후 최대 월간 상승을 기록하며 기대감이 커진 분위기다(cryptobriefing.com, 2026-09-24).
