TSLA:
  code: TSLA
  name_ko: 테슬라
  checked_at: '2026-10-25'
  one_liner: 전기차를 팔아 돈의 대부분(약 73%)을 벌고, 에너지 저장장치(메가팩)와 자율주행(FSD) 구독·로보택시·로봇(옵티머스)으로 다음 성장을 노리는 회사입니다.
  oligopoly:
    growth: 전기차 시장은 커지는 중입니다(2025년 세계 신차 4대 중 1대가 전기차, IEA). 하지만 테슬라 자체는 2025년 매출이 2.9% 줄어 처음 역성장했고, 2026년 3분기 인도량도 1년 전보다 2% 줄었습니다.
    share: 세계 순수전기차 판매 점유율 약 13%로 BYD(12%)와 1·2위를 다툽니다(Counterpoint, 2026년 2분기). 다만 상위 3사를 합쳐도 34%라 독점은 아닙니다.
    barriers: 대량 생산 원가 경쟁력, 슈퍼차저 충전망, 수백만 대 차량에서 모은 주행 데이터와 자체 소프트웨어가 해자입니다. 그러나 중국 업체들이 싸고 빠르게 따라오고 있습니다.
    verdict: △
  pick_and_shovel:
    verdict: X
    why: 누가 이기든 돈 버는 '청바지 회사'가 아니라, 직접 차를 팔며 경쟁하는 선수입니다. 에너지 저장장치(매출 약 13%)만 전력회사·데이터센터 쪽에 파는 '도구' 성격이 일부 있습니다.
  pricing_power:
    verdict: X
    why: 2025년 10월 미국 보조금(세액공제)이 끝나자 값을 낮춘 기본형 모델Y($39,990)·모델3($36,990)를 내놨고, 2026년 3분기에도 평균 판매가가 또 떨어졌습니다. 값을 올려 넘기기보다 내려서 파는 쪽입니다.
  data_company:
    verdict: O
    why: 도로 위 테슬라 차량들이 주행 데이터를 계속 모아 자율주행 학습에 씁니다. 무인 로보택시 누적 주행도 약 200만 마일에 이르렀습니다(2026년 3분기).
  wallet:
