MSFT:
  code: MSFT
  name_ko: 마이크로소프트
  checked_at: '2026-10-25'
  one_liner: 윈도우·오피스(마이크로소프트 365) 구독과 애저(Azure) 클라우드로 돈을 버는 회사예요. 회사들이 AI를 쓰려면 클라우드 서버와 코파일럿이 필요해서 애저가 빠르게 크고 있어요.
  oligopoly:
    growth: 성장 중이에요. FY2026 매출 3,318억 달러로 1년 전보다 18% 늘었고, 애저 등 클라우드 매출은 41% 늘었어요.
    share: 클라우드 인프라 시장 점유율 20%로 세계 2위예요 (아마존 28%, 구글 15%, Synergy Research 2026년 2분기).
    barriers: 데이터센터에 해마다 수백조 원을 써야 해서 새로 들어오기 어렵고, 회사들이 오피스·윈도우·애저에 업무를 다 묶어 두어서 바꾸기도 어려워요.
    verdict: O
  pick_and_shovel:
    verdict: O
    why: 애저는 오픈AI 같은 여러 AI 회사와 기업에 서버를 빌려줘서, 어느 AI 모델이 이기든 그 모델이 애저에서 돌면 돈을 벌어요. 다만 아마존·구글도 같은 장사를 해서 완전한 독점은 아니에요.
  pricing_power:
    verdict: O
    why: '2026년 7월 1일부터 기업용 마이크로소프트 365 가격을 올렸어요 (예: 비즈니스 베이직 월 6달러→7달러, F3 8달러→10달러). 그래도 FY2026 기업용 365 클라우드 매출은 17% 늘었어요.'
  data_company:
    verdict: △
    why: 빙 검색·링크드인·깃허브·오피스 사용 데이터를 모으고 오픈AI 지분도 갖고 있어요. 다만 구글처럼 개인 데이터로 광고 돈을 버는 회사는 아니고, 돈은 주로 기업 구독·클라우드에서 나와요.
  wallet:
    verdict: O
    why: 마이크로소프트 365(오피스) 구독, 엑스박스 게임패스, 코파일럿 유료 좌석(3,000만 개 넘음)처럼 매달 돈이 나가는 구독이 많아요. 개인용 365 구독 매출도 FY2026에 28% 늘었어요.
  human_indicator: 2026년 7월 실적 발표 직전 기사 기준, 주가가 그해 들어 18.7% 빠져 'AI에 쓴 돈이 정말 돌아오나' 하는 의심 분위기였어요 (과열보다는 걱정 쪽).
