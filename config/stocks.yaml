# 보유종목 목록. 종목을 추가하려면 아래 형식으로 한 덩어리를 복사해서 고치면 돼요.
#
#  - name: 종목 이름
#    market: KR            # KR(한국) 또는 US(미국)
#    code: "000270"        # 한국은 6자리 종목코드, 미국은 티커(예: MSFT)
#    methods: [PER]        # PER / PBR / DIV(배당) 중 골라서
#    per_basis: forward    # (선택) 조정 PER: 이익이 급증한 종목은 1년 뒤 실적 기준으로 밴드 계산
#    fair_methods: [PBR]   # (선택) 적정가 계산에 쓸 방식만 따로 (비우면 methods 전부)
#    data_code: "005930"   # (선택) 우선주처럼 실적·배당을 다른 코드(보통주)에서 가져올 때
#    splits: []            # (선택) 액면분할 기록 (예: [{date: "2018-05-04", ratio: 50}])
#    avg_price:            # 평단가 (비워두면 표시 안 함)
#    quantity:             # 수량 (비워두면 표시 안 함)
#    note: ""              # 화면에 같이 보여줄 메모

