# 🔍 빅테크 4곳 '숨은 숫자' — 🇺🇸 탭 '빅테크 현금흐름' 아래 (투자 → 감가상각 → 빚). 수집기가 site/data/capex.json 의 money 로 옮김
# 숫자는 전부 SEC 10-Q·10-K 원문 (XBRL 재무제표 + 본문 문장). 단위 $B (비율은 %). 분기 = 달력 분기 (마이크로소프트 FY27 1분기 = 26.3Q)
# 2026-10-31 양파농장 블로그 '26.3Q 빅테크 실발 정리'를 보고 대시보드에 없던 것만 골라 SEC 숫자로 다시 계산해 넣음 (블로그 그림·글은 옮기지 않음)
# 새 분기: tools/earnings_task.md 3-5 — 4곳 10-Q 가 다 나오면 charts 선마다 한 칸 추가 (12칸 넘으면 가장 오래된 칸 지움), asof·lease·commit·funding·easy 고치기
#   charts: k 열쇠 · t 제목 · u 단위 · why 계산 방법 · kid 그래프 밑 쉬운 설명 · s {티커: {분기: 값}} (감가상각은 1년 새 증가율이 맞게 소수 2자리)
asof: 26.3Q
names: {MSFT: 마이크로소프트, GOOG: 알파벳, META: 메타, AMZN: 아마존}
easy:
- 4곳 모두 1년 만에 설비투자(CapEx)를 거의 2배로 늘렸어요 — 이제 매출 100원 중 38~53원을 데이터센터·칩에 써요 (2년 반 전엔 10~18원)
- 산 설비는 몇 년에 나눠 비용(감가상각)이 되는데, 이 비용이 1년 새 25~56% 늘었어요 — 앞으로 이익을 깎는 '예약된 비용'
- 번 돈보다 투자가 커서 아마존·알파벳·메타는 빚을 크게 늘리고 자사주 매입(주주에게 돌려주는 돈)을 멈췄어요
- ⚠ 계약만 하고 아직 시작 안 된 데이터센터 임대(리스)가 마이크로소프트 3,646억$·메타 3,557억$ — 장부엔 아직 없지만 시작되면 비용이 돼요
