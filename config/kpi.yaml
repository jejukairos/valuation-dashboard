# 🔑 종목별 핵심 지표 — 주가를 움직이는 숫자 (종목 상세 화면, 작은 선 그래프 2~4개)
# 실적발표 보도자료·IR PDF·컨퍼런스콜·전자공시(DART·SEC)에서 숫자를 직접 옮겨 적어요. 원문에 없는 숫자는 만들지 않아요.
# 새 분기가 나오면 tools/earnings_task.md 3-2 순서대로 예약 작업이 이어 적어요 (선마다 최근 5개 분기).
#   key: 주가를 움직이는 열쇠 한 줄 · latest: 가장 최근 분기 · charts: t 제목, u 단위, why 왜 보나, s 선들 {n 이름, v {분기: 값}}
#   분기 이름 "26.3Q" = 달력 분기 (회계연도가 다른 회사는 분기 끝 날짜에서 45일 뺀 날의 분기)
#   💸 현금흐름(FCF = 영업현금흐름 − 설비투자)은 야후 분기 재무제표로 자동. 야후에 아직 없는 최신 분기만
#   fcf_add: {"26.3Q": -9065} 처럼 보도자료 숫자로 (미국 백만 달러, 한국 억원 · 키는 분기 끝 달 기준 — 엔비디아 10월 끝 = "26.10월")
#   qtr_add: {"2026-09-30": {rev, cogs, gp, rnd, sm, ga, sga, opex, op, tax, ni, fcf, capex}} — 야후에 아직 없는 최신 분기 손익 (보도자료, 미국 백만 달러 · 한국 억원)
#            → '실적 요약'·'돈의 흐름'·분기 그림이 최신 분기까지 그려져요. 야후가 그 분기를 주면 야후 값이 덮어써요
#   op_yoy: {"26.3Q": 40.1} — 📈 영업이익 성장률 (YoY, %) 매출 성장률 바로 아래 그래프. 한국은 DART 분기보고서·잠정실적으로 자동,
#           미국은 야후가 5분기만 줘서 보도자료(이번 분기 ÷ 1년 전 같은 분기 영업이익 − 1)로 적어요. 자동 값과 겹치면 이 값이 이겨요
#   op_note: 그 그래프 밑에 ⚠ 로 붙는 한 줄 — 일회성 비용(벌금·합의금·구조조정)이 든 분기를 꼭 적어요
#   fcf_hist: 💸 🇺🇸 탭 '빅테크 현금흐름' 그림용 예전 분기 FCF (야후에 없는 오래된 분기, 백만 달러 · 키는 달력 분기)
#   capex_guide: [{q: 3Q26, y: "2026", lo: 195, hi: 205, how: 유지, why: ..., cons: 202}] — 실적 발표 때마다 회사가 말한 연간 CapEx 계획($B, 상향·유지·감소), cons = 그때 시장 예상(컨센)
#   capex_cons: {26.3Q: {est: 55.40, act: 51.36, s: 출처}} — 분기 CapEx 컨센 vs 회사 발표($B) → 산업·비교 탭 '빅테크 CapEx' 와 종목 상세 '🏗 CapEx 컨센 대비'
#   patterns: [{t, date, steps: [{q, v, note}], lines, check, result, src}] — 🔁 반복되는 패턴 메모 (핵심 지표 맨 위, 예: 한화에어로스페이스 납품 공백 → 반등)
#             check = 다음에 무엇으로 확인할지, result = 확인 결과 (실적 발표 때 예약 작업이 채움)
#   capex_add: 같은 방식의 설비투자(Purchases of property and equipment, 백만 달러) — 🏭 산업 탭 '빅테크 CapEx' 에 써요
