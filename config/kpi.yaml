  memo: 3Q26 실적은 11월 초 발표 예정이라 26.2Q 까지. AFFO 는 FFO 에서 비현금 항목을 더 조정한 회사 정의 지표. 25.3Q·25.4Q 주당 AFFO 성장률은 보도자료 주당 값(1.08 vs 1.05 달러)으로 계산. 25.4Q 배당은 연간 지급액(2025년 3.217, 2024년 3.126 달러)에서 1~3분기 지급액을 빼 구한 값이라
    반올림 오차(±0.3%p)가 있음. '회사 몫'은 공동투자 펀드·합작사 지분만큼 조정한 금액(Pro-Rata). 입주율(98.7~98.9%)과 재임대 임대료 회수율(102.7~104.9%)은 거의 변하지 않아 그래프에서 뺌
