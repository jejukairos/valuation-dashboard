name: 데이터 갱신

on:
  schedule:
    # GitHub 예약 실행은 보통 20~30분 늦게 시작해서 20분 일찍 걸어 둔다 → 실제 07:30·18:30 무렵 갱신
    - cron: "10 22 * * 0-4"   # 평일 07:10 KST 예약 (미국장 마감 후) = 전날 22:10 UTC
    - cron: "10 9 * * 1-5"    # 평일 18:10 KST 예약 (한국장 마감·컨센서스 반영 후)
  workflow_dispatch:          # GitHub 화면에서 "Run workflow" 로 바로 실행
    inputs:
      test_fail:
        description: "실패 알림 시험 (금리 수집을 일부러 실패시킴)"
        type: boolean
        default: false
      attempt:
        description: "몇 번째 시도 (실패하면 스스로 다시 돌릴 때 씀, 최대 3)"
        type: number
        default: 1
  push:                       # 계산 코드·설정이 바뀌면 바로 다시 갱신 (봇의 데이터 저장은 이 경로가 아니라 다시 돌지 않음)
    branches: [main]
    paths: ["collector/**", "config/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  actions: write              # 실패하면 스스로 다시 돌리기 (아래 마지막 단계)

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # 앞 갱신이 끝나길 기다렸다 돌 때도 그 결과 위에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        id: collect
        timeout-minutes: 80       # 넘으면 이 단계만 멈추고 아래 상태 기록·저장·다시 시도는 그대로 (종목 계산은 55분이 지나면 남은 종목을 직전 값으로)
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          KRX_ID: ${{ secrets.KRX_ID || secrets.KRX_JEJUKAIROS21 }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          TEST_FAIL: ${{ inputs.test_fail }}
          PYTHONIOENCODING: utf-8
        run: python -u collector/main.py
      - name: 갱신 상태 기록 (실패하면 사이트 모든 탭 맨 위에 🚨 알림)
        if: always()
        run: python collector/run_status.py "${{ steps.collect.outcome }}" "${{ inputs.attempt || 1 }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: 저장 (실패해도 일부 결과는 저장)
        if: always()
        run: |
          git config user.name "valuation-bot"
          git config user.email "valuation-bot@users.noreply.github.com"
          git add site/data cache
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 갱신 중에 코드가 새로 올라왔으면 그 위에 얹어서 다시 저장 (최대 3번)
          # 데이터 파일이 겹치면 방금 만든 새 데이터로 (-X theirs = 다시 얹는 이 커밋 쪽)
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs -q || exit 1; done
          exit 1
      - name: 실패하면 다시 시도 (최대 3번, 그 뒤엔 다음 예약 갱신)
        if: always() && steps.collect.outcome != 'success' && (inputs.attempt || 1) < 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -f attempt=$(( ${{ inputs.attempt || 1 }} + 1 ))
